<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script src="/icone.js?v=1" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n-titulo="nav.separador">Navegação</title>
    <!-- O que as aplicações de mensagens mostram ao receber o endereço da
         página (ou o de uma casa: o servidor põe-lhe o número, ver
         src/index.ts). -->
    <meta name="description" content="Como chegar a uma casa do Bairro de Penajóia: escreva o número da casa e veja o caminho no mapa, passo a passo.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Malha Viva">
    <meta property="og:locale" content="pt_PT">
    <meta property="og:title" content="Navegação — Bairro de Penajóia">
    <meta property="og:description" content="Como chegar a uma casa do Bairro de Penajóia: escreva o número da casa e veja o caminho no mapa, passo a passo.">
    <meta property="og:url" content="https://malhaviva.pt/navegacao">
    <meta property="og:image" content="https://malhaviva.pt/navegacao/partilha.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <script src="/idiomas.js?v=44"></script>
    <script src="/logotipo.js?v=1"></script>
    <script src="/quadrado-de-espera.js?v=4"></script>
    <!-- O aviso de "está a demorar" e a tecla de tentar de novo, os
         mesmos em todo o site. -->
    <script src="/rede-de-seguranca.js?v=3"></script>
    <script src="/comando-paginas.js?v=7" defer></script>
    <!-- O mapa que se arrasta, aproxima e se inclina: o MapLibre, servido
         daqui mesmo, com a versão no nome da pasta (ver _headers). -->
    <link rel="stylesheet" href="/motor/maplibre-gl-6.16.0/maplibre-gl.css">
    <style>
        /* A letra do site: a Liberation Mono, servida daqui mesmo (ficheiros
           em /fonts, licença SIL Open Font). */
        @font-face {
            font-family: 'Liberation Mono';
            src: url('/fonts/LiberationMono-Regular.ttf') format('truetype');
            font-weight: 100 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Liberation Mono';
            src: url('/fonts/LiberationMono-Bold.ttf') format('truetype');
            font-weight: 600 900;
            font-style: normal;
            font-display: swap;
        }

        :root {
            /* O véu das barras que pairam por cima do mapa, o mesmo do
               Mapa dos Bairros: escuro junto à borda do ecrã e a
               desfazer-se para dentro. */
            --veu-forte: rgba(5, 5, 10, 0.8);
            --veu-medio: rgba(5, 5, 10, 0.45);
            --veu-nenhum: rgba(5, 5, 10, 0);
            --folga-cima: 16px;
            --folga-lado: 24px;
            --fundo: #05050a;
            --fio: rgba(255, 255, 255, 0.15);
            --painel: 340px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        body {
            background: var(--fundo);
            overflow: hidden;
            font-family: 'Liberation Mono', 'Courier New', monospace;
            color: #ffffff;
        }
        button, input, a {
            font-family: inherit;
        }
        [hidden] {
            display: none !important;
        }
        /* Só para quem ouve a página. */
        .so-leitor {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* ---- O mapa ----
           Enche a janela toda: a fotografia de satélite por baixo, o
           ortofotomapa do bairro por cima dela. */
        #mapa {
            position: absolute;
            inset: 0;
            background: var(--fundo);
        }
        #mapa .maplibregl-canvas:focus {
            outline: none;
        }
        #mapa .maplibregl-canvas:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.95);
            outline-offset: -4px;
        }

        /* ---- A barra de cima ----
           O logótipo (que volta ao bairro), com o véu por trás; à direita,
           o caminho de volta. O nome da página não se escreve: diz-se só a
           quem ouve a página (ver #titulo). */
        .barra-do-titulo {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: var(--folga-cima) var(--folga-lado) 34px;
            background: linear-gradient(to bottom, var(--veu-forte), var(--veu-medio) 55%, var(--veu-nenhum));
            pointer-events: none;
        }
        .barra-do-titulo > * {
            pointer-events: auto;
        }
        .marca {
            display: flex;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            flex-shrink: 0;
        }
        .marca .logotipo {
            height: 22px;
        }
        .voltar {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 8px 12px;
            border: 2.5px solid var(--fio);
            background: transparent;
            transition: background 0.15s ease;
            white-space: nowrap;
        }
        @media (hover: hover) {
            .voltar:hover {
                background: var(--fundo);
            }
        }
        .marca:focus-visible, .voltar:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.95);
            outline-offset: 2px;
        }

        /* ---- O painel ----
           A pergunta, as casas que respondem ao que se escreve, e, com uma
           casa escolhida, o percurso por palavras. Uma caixa do fundo do
           site, como os menus do bairro. */
        #painel {
            position: absolute;
            top: 84px;
            left: var(--folga-lado);
            z-index: 1001;
            box-sizing: border-box;
            width: var(--painel);
            max-height: calc(100% - 84px - 96px);
            overflow-y: auto;
            padding: 16px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.05), transparent), var(--fundo);
            border: 1px solid var(--fio);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        }
        #pergunta {
            display: block;
            margin-bottom: 10px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .campo {
            display: flex;
            gap: 8px;
        }
        #numero {
            flex: 1 1 auto;
            min-width: 0;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            border: 2.5px solid var(--fio);
            border-radius: 0;
            padding: 9px 12px;
            font-size: 1.05rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        #numero::placeholder {
            color: rgba(255, 255, 255, 0.4);
            text-transform: none;
            letter-spacing: 0;
        }
        #numero:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.55);
        }
        .botao {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            color: #ffffff;
            border: 2.5px solid var(--fio);
            border-radius: 0;
            padding: 8px 12px;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        @media (hover: hover) {
            .botao:hover {
                background: rgba(255, 255, 255, 0.1);
            }
        }
        .botao:focus-visible, #sugestoes button:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.95);
            outline-offset: 1px;
        }
        .botao.cheio {
            background: #ffffff;
            color: var(--fundo);
            border-color: #ffffff;
            font-weight: 600;
        }
        @media (hover: hover) {
            .botao.cheio:hover {
                background: rgba(255, 255, 255, 0.85);
            }
        }

        /* As casas que respondem ao que se escreveu: quadrados com o
           número, lado a lado. */
        #sugestoes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0 0;
            padding: 0;
            list-style: none;
        }
        #sugestoes:empty {
            display: none;
        }
        #sugestoes button {
            background: transparent;
            color: #ffffff;
            border: 2.5px solid var(--fio);
            border-radius: 0;
            padding: 5px 9px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        @media (hover: hover) {
            #sugestoes button:hover {
                background: rgba(255, 255, 255, 0.1);
            }
        }
        .aviso {
            margin: 10px 0 0;
            font-size: 0.75rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.65);
        }
        .aviso:empty {
            display: none;
        }

        /* A casa escolhida e o percurso. */
        #resultado {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--fio);
        }
        .casa-escolhida {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        #casa-nome {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }
        #resumo {
            margin: 4px 0 0;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
        }
        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        #indicacoes {
            margin-top: 14px;
        }
        #indicacoes summary {
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #indicacoes summary::-webkit-details-marker {
            display: none;
        }
        #indicacoes summary::before {
            content: "";
            width: 0;
            height: 0;
            border-left: 5px solid #ffffff;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            transition: transform 0.15s ease;
        }
        #indicacoes[open] summary::before {
            transform: rotate(90deg);
        }
        #indicacoes summary:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.95);
            outline-offset: 2px;
        }
        #passos {
            margin: 10px 0 0;
            padding: 0;
            list-style: none;
            counter-reset: passo;
        }
        #passos li {
            counter-increment: passo;
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 8px;
            padding: 7px 0;
            font-size: 0.8rem;
            line-height: 1.45;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            cursor: pointer;
        }
        #passos li::before {
            content: counter(passo);
            color: rgba(255, 255, 255, 0.5);
            font-variant-numeric: tabular-nums;
        }
        #passos li.chegada {
            font-weight: 600;
        }

        /* ---- No mapa ---- */
        /* O número de cada casa, de perto: no telhado, escrito a branco
           com uma sombra, para se ler tanto na chapa como no chão. */
        .rotulo-casa {
            padding: 1px 3px;
            white-space: nowrap;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 2px rgba(0, 0, 0, 0.95);
            cursor: pointer;
        }
        /* A casa para onde se vai: o número num quadrado branco, com um bico
           por baixo a apontar para o telhado. */
        .destino {
            z-index: 3;
            padding-bottom: 6px;
            pointer-events: none;
        }
        .destino span {
            position: relative;
            display: block;
            padding: 3px 7px;
            white-space: nowrap;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--fundo);
            background: #ffffff;
            border: 2px solid var(--fundo);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }
        .destino span::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid var(--fundo);
        }
        /* Onde o percurso começa: um quadrado com o nome por cima. */
        .inicio {
            z-index: 2;
            width: 16px;
            height: 16px;
            box-sizing: border-box;
            background: var(--fundo);
            border: 3px solid #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }
        .inicio .nome {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 4px);
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 5px;
            background: rgba(5, 5, 10, 0.85);
        }
        /* Onde a pessoa está, quando deixa o telemóvel dizê-lo. */
        .voce {
            z-index: 4;
            width: 18px;
            height: 18px;
            box-sizing: border-box;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--fundo);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6), 0 1px 4px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        /* ---- A barra dos comandos ----
           A do Mapa dos Bairros: os créditos e os botões, por cima do fundo
           do mapa, com o véu virado ao contrário. */
        .video-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
            padding: 40px 24px 16px;
            background: linear-gradient(to top, var(--veu-forte), var(--veu-medio) 60%, var(--veu-nenhum));
            pointer-events: none;
        }
        .video-controls > * {
            pointer-events: auto;
        }
        .controls-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .creditos {
            flex: 1 1 auto;
            min-width: 0;
            text-align: right;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }
        .creditos a {
            color: inherit;
        }
        .player-btn {
            background: transparent;
            border: 2.5px solid var(--fio);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
            padding: 8px;
            border-radius: 0;
        }
        @media (hover: hover) {
            .player-btn:hover {
                background: var(--fundo);
            }
        }
        .player-btn:disabled {
            color: #8e8e91;
            cursor: default;
        }
        .player-btn:disabled:hover {
            background: transparent;
        }
        .player-btn.ligado {
            background: #ffffff;
            color: var(--fundo);
            border-color: #ffffff;
        }
        .player-btn:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.95);
            outline-offset: 2px;
        }

        /* ---- O ecrã de espera ---- */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: var(--fundo);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity 0.4s ease;
        }
        #loading-overlay.escondido {
            opacity: 0;
            pointer-events: none;
        }
        #loading-overlay .aviso {
            font-size: 0.85rem;
        }

        @media (max-width: 900px) {
            :root {
                --folga-cima: 12px;
                --folga-lado: 16px;
            }
            .video-controls {
                padding: 32px 12px 14px;
                gap: 10px;
            }
            .controls-right {
                gap: 8px;
            }
            .player-btn svg {
                width: 18px;
                height: 18px;
            }
        }
        /* No telemóvel o painel vai de lado a lado, por baixo da barra de
           cima, e as indicações começam dobradas, para o mapa se ver. */
        @media (max-width: 640px) {
            .marca .logotipo {
                height: 19px;
            }
            .voltar .texto {
                display: none;
            }
            #painel {
                top: 66px;
                left: 12px;
                right: 12px;
                width: auto;
                max-height: calc(100% - 66px - 120px);
                padding: 12px;
            }
            /* Com a casa escolhida, a pergunta já foi respondida: sai, e o
               resto aperta-se, para o mapa ficar com o ecrã. */
            body.com-casa #pergunta {
                display: none;
            }
            #resultado {
                margin-top: 12px;
                padding-top: 10px;
            }
            #casa-nome {
                font-size: 1.1rem;
            }
            .botoes {
                gap: 6px;
                margin-top: 10px;
            }
            .botoes .botao {
                font-size: 0.72rem;
                padding: 6px 8px;
            }
            #indicacoes {
                margin-top: 10px;
            }
            .video-controls {
                flex-wrap: wrap;
                row-gap: 10px;
            }
            .creditos {
                order: -1;
                flex-basis: 100%;
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div id="mapa" aria-label="Mapa do Bairro de Penajóia, com o percurso até à casa escolhida" data-i18n-aria="nav.mapa"></div>

    <header class="barra-do-titulo">
        <a href="/" class="marca" id="marca" aria-label="Voltar ao bairro" title="Voltar ao bairro" data-i18n-aria="nav.voltarBairro" data-i18n-title="nav.voltarBairro"></a>
        <h1 id="titulo" class="so-leitor" data-i18n="nav.titulo">Navegação</h1>
        <a href="/" class="voltar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><polyline points="11 5 4 12 11 19"></polyline><line x1="4" y1="12" x2="21" y2="12"></line></svg>
            <span class="texto" data-i18n="nav.voltarBairro">Voltar ao bairro</span>
        </a>
    </header>

    <section id="painel" aria-labelledby="pergunta">
        <form id="procura" role="search" autocomplete="off">
            <label id="pergunta" for="numero" data-i18n="nav.pergunta">Para que casa vai?</label>
            <div class="campo">
                <input id="numero" type="text" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="aviso" aria-controls="sugestoes">
                <button type="submit" class="botao cheio" id="ir" data-i18n="nav.ir">Ir</button>
            </div>
            <ul id="sugestoes" aria-label="Casas com este número" data-i18n-aria="nav.sugestoes"></ul>
            <p id="aviso" class="aviso" data-i18n="nav.ajuda">As casas são numeradas com uma letra e um número, como A12 ou D31.</p>
        </form>

        <div id="resultado" hidden>
            <div class="casa-escolhida">
                <h2 id="casa-nome"></h2>
                <button type="button" class="botao" id="outra" data-i18n="nav.outra">Outra casa</button>
            </div>
            <p id="resumo" aria-hidden="true"></p>
            <p id="resumo-leitor" class="so-leitor" aria-live="polite"></p>
            <p id="nota" class="aviso" aria-live="polite"></p>
            <div class="botoes">
                <button type="button" class="botao" id="daqui">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="12" r="6"></circle><line x1="12" y1="1" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="23"></line><line x1="1" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="23" y2="12"></line></svg>
                    <span data-i18n="nav.daqui">A partir de onde estou</span>
                </button>
                <a class="botao" id="como-chegar" target="_blank" rel="noopener" data-i18n="nav.comoChegar">Como chegar à entrada</a>
                <button type="button" class="botao" id="partilhar"></button>
            </div>
            <details id="indicacoes" open>
                <summary data-i18n="nav.indicacoes">Indicações</summary>
                <ol id="passos"></ol>
            </details>
        </div>
    </section>

    <div class="video-controls" id="controlos">
        <div class="creditos" id="creditos"></div>
        <div class="controls-right">
            <button class="player-btn" id="onde-estou-btn" title="Onde estou" data-i18n-title="nav.ondeEstou" data-i18n-aria="nav.ondeEstou" aria-label="Onde estou" aria-pressed="false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="12" r="6"></circle><line x1="12" y1="1" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="23"></line><line x1="1" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="23" y2="12"></line></svg>
            </button>
            <button class="player-btn" id="afastar-btn" title="Afastar" data-i18n-title="foto.afastar" data-i18n-aria="foto.afastar" aria-label="Afastar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="8" y1="11" x2="14" y2="11"></line><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
            </button>
            <button class="player-btn" id="aproximar-btn" title="Aproximar" data-i18n-title="foto.aproximar" data-i18n-aria="foto.aproximar" aria-label="Aproximar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="8" y1="11" x2="14" y2="11"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
            </button>
            <button class="player-btn" id="fullscreen-btn" title="Ecrã inteiro" data-i18n-title="foto.ecra" data-i18n-aria="foto.ecra" aria-label="Ecrã inteiro"></button>
        </div>
    </div>

    <div id="loading-overlay">
        <div id="espera"></div>
        <div class="aviso" data-i18n="nav.carregar">A carregar o mapa…</div>
    </div>

    <script type="module">
        import * as maplibregl from '/motor/maplibre-gl-6.16.0/maplibre-gl.mjs';
        import { carregarRede, ORTOFOTO, METROS_POR_MINUTO, ESTRADA, RUA, BECO, LIGACAO, normalizar, arredondar, alisar, casaPedida, enderecoDaCasa } from '/navegacao.mjs?v=5';
        import { SATELITE } from '/mapa-dos-bairros.mjs?v=7';

        // A inclinação do mapa, em graus (0 é a pique, de cima): a vista
        // ligeiramente deitada dos mapas de navegação, como a do Google Maps.
        // Com dois dedos a subir ou a descer, no telemóvel, inclina-se mais
        // ou menos, até INCLINACAO_MAXIMA.
        const INCLINACAO = 40;
        const INCLINACAO_MAXIMA = 60;
        const PASSO_DAS_SETAS = 120;
        // Os níveis do mapa (os do MapLibre, que vão um abaixo dos do
        // Leaflet para a mesma escala). O ortofotomapa tem 2,5 cm por ponto e
        // os quadrados mais finos 3 cm (ver scripts/navegacao/mosaicos.py).
        const ZOOM_MINIMO = 12;
        const ZOOM_MAXIMO = 21.5;
        const ZOOM_DOS_NUMEROS = 18;
        const ZOOM_DE_PERTO = 18;
        const ZOOM_DO_PERCURSO = 19;
        // Quanto se alisa a linha do percurso, em metros (ver alisar, em
        // navegacao.mjs).
        const ALISAR_M = 4;
        // Mais longe do que isto da rede, o percurso não parte de onde a
        // pessoa está, mas da entrada do bairro mais perto da casa.
        const LONGE_DO_BAIRRO_M = 400;
        // Mais longe do que isto da rede, a ligação até ela é a tracejado.
        const FORA_DA_REDE_M = 12;
        // Andar isto com o percurso aberto faz refazê-lo a partir de onde
        // se está.
        const REFAZER_M = 10;
        const ESPERA_MAXIMA_MS = 12000;

        const diz = (chave, alternativa) => (window.Idiomas && window.Idiomas.t(chave)) || alternativa || '';
        const preencher = (texto, valores) => texto.replace(/\{(\w+)\}/g, (_, k) => (valores[k] != null ? valores[k] : ''));

        const overlay = document.getElementById('loading-overlay');
        const entrada = document.getElementById('numero');
        const sugestoesEl = document.getElementById('sugestoes');
        const avisoEl = document.getElementById('aviso');
        const resultadoEl = document.getElementById('resultado');
        const casaNomeEl = document.getElementById('casa-nome');
        const resumoEl = document.getElementById('resumo');
        const resumoLeitorEl = document.getElementById('resumo-leitor');
        const notaEl = document.getElementById('nota');
        const passosEl = document.getElementById('passos');
        const comoChegarEl = document.getElementById('como-chegar');
        const partilharEl = document.getElementById('partilhar');
        const daquiEl = document.getElementById('daqui');
        const ondeEstouEl = document.getElementById('onde-estou-btn');
        const creditosEl = document.getElementById('creditos');
        const botaoAproximar = document.getElementById('aproximar-btn');
        const botaoAfastar = document.getElementById('afastar-btn');
        const botaoEcra = document.getElementById('fullscreen-btn');
        const painel = document.getElementById('painel');

        const ICONE_ECRA_INTEIRO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M8 3H3v5m18 0V3h-5m0 18h5v-5M3 16v5h5"></path></svg>';
        const ICONE_SAIR_DO_ECRA = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9h6V3 M21 9h-6V3 M21 15h-6v6 M3 15h6v6"></path></svg>';

        if (window.Logotipo) window.Logotipo.desenhar(document.getElementById('marca'));
        if (window.QuadradoDeEspera) window.QuadradoDeEspera.fazer(document.getElementById('espera'));

        const rede = window.RedeDeSeguranca ? window.RedeDeSeguranca.vigiar({
            espera: 40,
            pronto: () => overlay.classList.contains('escondido'),
            caixa: () => overlay
        }) : null;
        const falhou = (chave, textoPt) => {
            document.getElementById('espera').style.display = 'none';
            overlay.querySelector('.aviso').style.display = 'none';
            overlay.classList.remove('escondido');
            if (rede) rede.avisar(chave, textoPt);
            else overlay.textContent = diz(chave, textoPt);
        };

        // As preposições que mudam com a rua ("na Rua", "no Largo"): na
        // lista das línguas vêm as duas formas, "na|no".
        const masculina = (rua) => /^(Largo|Beco|Caminho|Passeio|P[áa]tio|Terreiro|Adro|Alto|Cais|Jardim|Bairro)\b/i.test(rua);
        const prep = (chave, rua) => {
            const formas = diz(chave, '').split('|');
            return formas[masculina(rua) ? 1 : 0] || formas[0];
        };

        // ---- Contas com sítios ----
        //
        // A rede e as casas dizem os sítios como [latitude, longitude]; o
        // MapLibre quer [longitude, latitude].
        const lngLat = (p) => [p[1], p[0]];
        const RAIO_DA_TERRA = 6371008;
        const distancia = (a, b) => {
            const r = Math.PI / 180;
            const dLat = (b[0] - a[0]) * r;
            const dLon = (b[1] - a[1]) * r;
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
            return 2 * RAIO_DA_TERRA * Math.asin(Math.min(1, Math.sqrt(h)));
        };
        // A caixa de uns quantos sítios, com uma folga à volta (uma fração
        // do tamanho dela), como [[oeste, sul], [este, norte]].
        const caixaDe = (pontos, folga = 0) => {
            let o = Infinity;
            let s = Infinity;
            let e = -Infinity;
            let n = -Infinity;
            for (const [lat, lon] of pontos) {
                o = Math.min(o, lon);
                e = Math.max(e, lon);
                s = Math.min(s, lat);
                n = Math.max(n, lat);
            }
            const dx = (e - o) * folga;
            const dy = (n - s) * folga;
            return [[o - dx, s - dy], [e + dx, n + dy]];
        };
        // Um círculo de 'raio' metros à volta de um sítio, para a
        // incerteza da posição.
        const circulo = (centro, raio) => {
            const kx = 111320 * Math.cos(centro[0] * Math.PI / 180);
            const anel = [];
            for (let i = 0; i <= 48; i++) {
                const a = i / 48 * 2 * Math.PI;
                anel.push([centro[1] + Math.cos(a) * raio / kx, centro[0] + Math.sin(a) * raio / 110574]);
            }
            return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [anel] }, properties: {} };
        };
        const linhas = (lista) => ({
            type: 'FeatureCollection',
            features: lista.filter((l) => l && l.length > 1).map((l) => ({
                type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: l.map(lngLat) }
            }))
        });
        const NADA = { type: 'FeatureCollection', features: [] };

        // ---- Começar: a rede e a lista dos quadrados do ortofotomapa ----
        let rede_ = null;
        let indice = null;
        try {
            [rede_, indice] = await Promise.all([
                carregarRede(),
                fetch(ORTOFOTO.indice).then((x) => x.json())
            ]);
        } catch (e) {
            console.error(e);
            falhou('nav.erro', 'Não foi possível carregar o mapa.');
            throw e;
        }
        // Os quadrados que existem: os que cairiam fora do ortofotomapa não
        // foram feitos (ver mosaicos.py), e não se pedem.
        const quadrados = new Set();
        for (const [z, lista] of Object.entries(indice.quadrados)) {
            for (const [x, y] of lista) quadrados.add(z + '/' + x + '/' + y);
        }
        // Os limites do ortofotomapa, tirados dos quadrados do nível de cima.
        const z0 = indice.niveis[0];
        const lado = 2 ** z0;
        const latDoQuadrado = (y) => Math.atan(Math.sinh(Math.PI * (1 - 2 * y / lado))) * 180 / Math.PI;
        const xs = indice.quadrados[z0].map((q) => q[0]);
        const ys = indice.quadrados[z0].map((q) => q[1]);
        const limitesDoOrtofoto = [
            [Math.min(...xs) / lado * 360 - 180, latDoQuadrado(Math.max(...ys) + 1)],
            [(Math.max(...xs) + 1) / lado * 360 - 180, latDoQuadrado(Math.min(...ys))]
        ];
        const limitesDoBairro = caixaDe([...rede_.casas.values()].flat().map((c) => c.ponto), 0.15);

        // Um quadrado do ortofotomapa que não existe é um quadrado vazio,
        // sem ir pedi-lo ao servidor (um ponto transparente, em PNG).
        const VAZIO = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='), (c) => c.charCodeAt(0));
        maplibregl.addProtocol('ortofoto', async (pedido, abortar) => {
            const zxy = pedido.url.replace('ortofoto://', '');
            if (!quadrados.has(zxy)) return { data: VAZIO.slice().buffer };
            const resposta = await fetch(ORTOFOTO.endereco.replace('{z}/{x}/{y}', zxy), { signal: abortar.signal });
            if (!resposta.ok) return { data: VAZIO.slice().buffer };
            return { data: await resposta.arrayBuffer() };
        });

        // ---- O mapa ----
        //
        // A fotografia de satélite por baixo, o ortofotomapa do bairro por
        // cima dela, e por cima de tudo o percurso. Sem os botões nem os
        // créditos do próprio MapLibre: os do site estão na barra de baixo. O
        // mapa não roda (o norte fica sempre para cima), só se inclina.
        //
        // Nos ecrãs finos (mais de um ponto do ecrã por ponto da página), os
        // quadrados das fotografias contam como mais pequenos, para vir um
        // nível mais perto e não se verem desfocados (a mesma conta do
        // Mapa dos Bairros).
        const ecraFino = (window.devicePixelRatio || 1) >= 1.5;
        const LADO = ecraFino ? 128 : 256;
        let mapa = null;
        try {
            mapa = new maplibregl.Map({
                container: 'mapa',
                style: {
                    version: 8,
                    sources: {
                        satelite: { type: 'raster', tiles: [SATELITE.endereco], tileSize: LADO, maxzoom: SATELITE.zoomMaximo },
                        ortofoto: {
                            type: 'raster', tiles: ['ortofoto://{z}/{x}/{y}'], tileSize: LADO,
                            minzoom: indice.niveis[0], maxzoom: indice.niveis[1],
                            bounds: [...limitesDoOrtofoto[0], ...limitesDoOrtofoto[1]]
                        },
                        rede: { type: 'geojson', data: NADA },
                        precisao: { type: 'geojson', data: NADA },
                        tracejado: { type: 'geojson', data: NADA },
                        percurso: { type: 'geojson', data: NADA }
                    },
                    layers: [
                        { id: 'fundo', type: 'background', paint: { 'background-color': '#05050a' } },
                        { id: 'satelite', type: 'raster', source: 'satelite', paint: { 'raster-fade-duration': 120 } },
                        { id: 'ortofoto', type: 'raster', source: 'ortofoto', paint: { 'raster-fade-duration': 120 } },
                        // A rede, para quem tem o menu de desenvolvedor (ver verRede).
                        {
                            id: 'rede', type: 'line', source: 'rede',
                            layout: { visibility: 'none', 'line-join': 'round', 'line-cap': 'round' },
                            paint: {
                                'line-width': 2,
                                'line-color': ['match', ['get', 'tipo'],
                                    ESTRADA, '#ffffff', RUA, '#ffd400', BECO, '#00e060', LIGACAO, '#ff40ff', '#ff3030']
                            }
                        },
                        {
                            id: 'precisao', type: 'fill', source: 'precisao',
                            paint: { 'fill-color': '#ffffff', 'fill-opacity': 0.12, 'fill-outline-color': 'rgba(255, 255, 255, 0.6)' }
                        },
                        // Uma linha branca com um contorno escuro, como as
                        // estradas dos mapas: lisa, de pontas e curvas redondas,
                        // e mais larga de perto.
                        {
                            id: 'percurso-contorno', type: 'line', source: 'percurso',
                            layout: { 'line-join': 'round', 'line-cap': 'round' },
                            paint: {
                                'line-color': '#05050a', 'line-opacity': 0.85,
                                'line-width': ['interpolate', ['exponential', 1.6], ['zoom'], 14, 6, 18, 10, 21, 22]
                            }
                        },
                        {
                            id: 'percurso', type: 'line', source: 'percurso',
                            layout: { 'line-join': 'round', 'line-cap': 'round' },
                            paint: {
                                'line-color': '#ffffff',
                                'line-width': ['interpolate', ['exponential', 1.6], ['zoom'], 14, 3, 18, 6, 21, 14]
                            }
                        },
                        // Da rede até à casa, e de onde se está até à rede:
                        // pontinhos.
                        {
                            id: 'tracejado', type: 'line', source: 'tracejado',
                            layout: { 'line-cap': 'round' },
                            paint: {
                                'line-color': '#ffffff',
                                'line-width': ['interpolate', ['linear'], ['zoom'], 14, 3, 18, 4, 21, 7],
                                'line-dasharray': [0.1, 2]
                            }
                        }
                    ]
                },
                bounds: limitesDoBairro,
                pitch: INCLINACAO,
                maxPitch: INCLINACAO_MAXIMA,
                minZoom: ZOOM_MINIMO,
                maxZoom: ZOOM_MAXIMO,
                // Não se sai da zona do bairro: há margem para os lados, mas
                // não para se perder em Almada.
                maxBounds: caixaDe([[limitesDoOrtofoto[0][1], limitesDoOrtofoto[0][0]], [limitesDoOrtofoto[1][1], limitesDoOrtofoto[1][0]]], 2.5),
                attributionControl: false,
                dragRotate: false,
                pitchWithRotate: false,
                touchPitch: true,
                keyboard: false,
                boxZoom: false,
                fadeDuration: 0
            });
        } catch (e) {
            console.error(e);
            falhou('nav.erro', 'Não foi possível carregar o mapa.');
            throw e;
        }
        mapa.touchZoomRotate.disableRotation();
        await new Promise((pronto) => (mapa.loaded() ? pronto() : mapa.once('load', pronto)));

        // Para quem verifica a página por dentro (as ferramentas do navegador).
        window.navegacao = { mapa, rede: rede_ };

        // ---- Enquadrar ----
        //
        // O que o painel tapa do mapa, para os enquadramentos não porem nada
        // debaixo dele: à esquerda no computador, em cima no telemóvel.
        const tamanhoDoMapa = () => {
            const c = mapa.getContainer();
            return { x: c.clientWidth, y: c.clientHeight };
        };
        const folgas = () => {
            const cima = document.querySelector('.barra-do-titulo').offsetHeight;
            const baixo = document.getElementById('controlos').offsetHeight;
            const p = painel.getBoundingClientRect();
            const estreito = window.innerWidth <= 640;
            // (Uns pontos a mais de cada lado para o nome da entrada, que
            // fica por cima do quadrado dela, não sair do ecrã.)
            const cimaEsq = [estreito ? 40 : p.right + 40, (estreito ? p.bottom : cima) + 24];
            const baixoDir = [40, baixo + 8];
            // Nunca mais folga do que o mapa tem: num ecrã baixo (um
            // telemóvel deitado) com o painel aberto, sobrava mapa nenhum, e
            // o enquadramento falhava. Fica sempre pelo menos um terço dele.
            const tamanho = tamanhoDoMapa();
            [[0, tamanho.x], [1, tamanho.y]].forEach(([i, total]) => {
                const soma = cimaEsq[i] + baixoDir[i];
                const maximo = total * 2 / 3;
                if (soma > maximo) {
                    cimaEsq[i] *= maximo / soma;
                    baixoDir[i] *= maximo / soma;
                }
            });
            return { left: cimaEsq[0], top: cimaEsq[1], right: baixoDir[0], bottom: baixoDir[1] };
        };

        // Leva o mapa a mostrar uns sítios, entre as barras e o painel: a
        // voar, ou de uma vez. Um mapa sem tamanho (a página aberta numa
        // moldura escondida) não tem onde enquadrar: fica ao meio deles.
        //
        // O MapLibre enquadra como se visse o mapa a pique; inclinado, o que
        // fica perto (em baixo no ecrã) aparece maior e saía da folga — o
        // nome da entrada ficava cortado na borda. Por isso acerta-se aos
        // poucos: põe-se a câmara, vê-se onde os sítios caem de facto no
        // ecrã, e corrige-se o meio e o zoom, umas quantas vezes. As contas
        // fazem-se com a câmara a saltar de um lado para o outro dentro do
        // mesmo instante, sem nada se desenhar; depois volta onde estava e
        // voa até ao sítio certo.
        const mostrarNoMapa = (sitios, { maxZoom = ZOOM_MAXIMO } = {}, animar) => {
            const tamanho = tamanhoDoMapa();
            const caixa = caixaDe(sitios);
            const meio = [(caixa[0][0] + caixa[1][0]) / 2, (caixa[0][1] + caixa[1][1]) / 2];
            if (!(tamanho.x > 0 && tamanho.y > 0)) {
                mapa.jumpTo({ center: meio });
                return;
            }
            const f = folgas();
            const pitch = mapa.getPitch();
            const antes = { center: mapa.getCenter(), zoom: mapa.getZoom(), pitch, bearing: mapa.getBearing() };
            const passo = Math.max(1, Math.ceil(sitios.length / 300));
            const amostra = sitios.filter((_, i) => i % passo === 0).concat([sitios[sitios.length - 1]]);
            const largura = tamanho.x - f.left - f.right;
            const altura = tamanho.y - f.top - f.bottom;
            let camara = mapa.cameraForBounds(caixa, { padding: f, bearing: 0, maxZoom }) || { center: meio, zoom: mapa.getZoom() };
            for (let volta = 0; volta < 5; volta++) {
                mapa.jumpTo({ center: camara.center, zoom: camara.zoom, pitch, bearing: 0 });
                let x0 = Infinity;
                let y0 = Infinity;
                let x1 = -Infinity;
                let y1 = -Infinity;
                for (const s of amostra) {
                    const q = mapa.project(lngLat(s));
                    x0 = Math.min(x0, q.x);
                    x1 = Math.max(x1, q.x);
                    y0 = Math.min(y0, q.y);
                    y1 = Math.max(y1, q.y);
                }
                const escala = Math.min(largura / Math.max(1, x1 - x0), altura / Math.max(1, y1 - y0));
                const dx = (x0 + x1) / 2 - (f.left + largura / 2);
                const dy = (y0 + y1) / 2 - (f.top + altura / 2);
                const zoom = Math.min(maxZoom, camara.zoom + Math.log2(escala) * 0.95);
                camara = { center: mapa.unproject([tamanho.x / 2 + dx, tamanho.y / 2 + dy]), zoom };
                if (Math.abs(Math.log2(escala)) < 0.02 && Math.abs(dx) < 2 && Math.abs(dy) < 2) break;
            }
            mapa.jumpTo(antes);
            if (animar) mapa.flyTo({ ...camara, pitch, bearing: 0, duration: 900, essential: true });
            else mapa.jumpTo({ ...camara, pitch, bearing: 0 });
        };
        const cantosDoBairro = [
            [limitesDoBairro[0][1], limitesDoBairro[0][0]], [limitesDoBairro[1][1], limitesDoBairro[1][0]],
            [limitesDoBairro[0][1], limitesDoBairro[1][0]], [limitesDoBairro[1][1], limitesDoBairro[0][0]]
        ];
        const vistaDoBairro = (animar) => mostrarNoMapa(cantosDoBairro, {}, animar);
        vistaDoBairro(false);

        // ---- Aproximar e afastar ----
        const pintarBotoesDoZoom = () => {
            const z = mapa.getZoom();
            botaoAproximar.disabled = z >= mapa.getMaxZoom() - 0.01;
            botaoAfastar.disabled = z <= mapa.getMinZoom() + 0.01;
        };
        mapa.on('zoomend', pintarBotoesDoZoom);
        botaoAproximar.addEventListener('click', () => mapa.zoomIn({ duration: 300 }));
        botaoAfastar.addEventListener('click', () => mapa.zoomOut({ duration: 300 }));
        // Os gatilhos do comando (ver comando-paginas.js) aproximam e
        // afastam por aqui, aos passos — positivos para chegar perto.
        window.zoomDaPagina = (passos) => mapa.easeTo({ zoom: mapa.getZoom() + passos * 0.3, duration: 150 });

        let casaEscolhida = null;

        // ---- Os números das casas, de perto ----
        //
        // De perto, cada casa tem o número no telhado; tocar nele escolhe-a.
        // Com o mapa inclinado, as casas lá ao fundo ficam umas em cima das
        // outras: põem-se primeiro os números das mais perto (as de baixo no
        // ecrã), e um número que tocasse noutro já posto não se põe. O da
        // casa escolhida sai: ela já tem o seu, no quadrado branco, e à volta
        // dele não se põe nenhum.
        const rotulos = new Map();
        const verNumeros = () => {
            const tela = tamanhoDoMapa();
            const ficam = new Set();
            if (mapa.getZoom() >= ZOOM_DOS_NUMEROS && tela.x > 0) {
                const ocupado = [];
                const tocam = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
                if (casaEscolhida) {
                    const p = mapa.project(lngLat(casaEscolhida.ponto));
                    ocupado.push([p.x - 40, p.y - 40, p.x + 40, p.y + 8]);
                }
                const candidatos = [];
                for (const lista of rede_.casas.values()) {
                    for (const casa of lista) {
                        if (casa === casaEscolhida) continue;
                        const p = mapa.project(lngLat(casa.ponto));
                        if (p.x > -20 && p.x < tela.x + 20 && p.y > -10 && p.y < tela.y + 10) candidatos.push({ casa, p });
                    }
                }
                candidatos.sort((a, b) => b.p.y - a.p.y);
                for (const { casa, p } of candidatos) {
                    const meia = 3.5 * casa.n.length + 5;
                    const caixa = [p.x - meia, p.y - 9, p.x + meia, p.y + 9];
                    if (ocupado.some((o) => tocam(caixa, o))) continue;
                    ocupado.push(caixa);
                    ficam.add(casa);
                }
            }
            for (const [casa, m] of rotulos) {
                if (!ficam.has(casa)) {
                    m.remove();
                    rotulos.delete(casa);
                }
            }
            for (const casa of ficam) {
                if (rotulos.has(casa)) continue;
                const el = document.createElement('div');
                el.className = 'rotulo-casa';
                el.textContent = casa.n;
                el.setAttribute('aria-hidden', 'true');
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    escolher(casa);
                });
                rotulos.set(casa, new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(lngLat(casa.ponto)).addTo(mapa));
            }
        };
        mapa.on('moveend', verNumeros);

        // ---- A rede, para quem tem o menu de desenvolvedor ----
        //
        // As ruas desenhadas (amarelo as largas, verde as estreitas), as
        // estradas (branco) e as ligações das ruas às estradas (rosa): para
        // ver de perto se tudo bate com a fotografia.
        let redePosta = false;
        const verRede = () => {
            let quer = false;
            try { quer = localStorage.getItem('programador') === 'on'; } catch (e) { /* sem memória */ }
            if (quer && !redePosta) {
                mapa.getSource('rede').setData({
                    type: 'FeatureCollection',
                    features: rede_.trocos.map((t) => ({
                        type: 'Feature', properties: { tipo: t.tipo },
                        geometry: { type: 'LineString', coordinates: t.pontos.map(lngLat) }
                    }))
                });
                redePosta = true;
            }
            mapa.setLayoutProperty('rede', 'visibility', quer ? 'visible' : 'none');
        };
        window.addEventListener('storage', (e) => {
            if (e.key === 'programador' || e.key === null) verRede();
        });
        verRede();

        // ---- Procurar a casa ----
        const mostrarSugestoes = () => {
            const lista = rede_.procurar(entrada.value, 12);
            sugestoesEl.innerHTML = '';
            for (const n of lista) {
                const casas = rede_.casas.get(n);
                casas.forEach((casa, i) => {
                    const li = document.createElement('li');
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = casas.length > 1
                        ? preencher(diz('nav.sitio', '{numero} — sítio {i}'), { numero: n, i: i + 1 })
                        : n;
                    b.addEventListener('click', () => escolher(casa));
                    li.appendChild(b);
                    sugestoesEl.appendChild(li);
                });
            }
            const q = normalizar(entrada.value);
            if (!q) avisoEl.textContent = diz('nav.ajuda', 'As casas são numeradas com uma letra e um número, como A12 ou D31.');
            else if (!lista.length) avisoEl.textContent = preencher(diz('nav.nenhuma', 'Não há nenhuma casa com o número {numero}.'), { numero: q });
            else if (rede_.casas.has(q) && rede_.casas.get(q).length > 1) {
                avisoEl.textContent = preencher(diz('nav.repetido', 'O número {numero} aparece em {n} sítios no levantamento: escolha um.'), { numero: q, n: rede_.casas.get(q).length });
            } else avisoEl.textContent = '';
        };
        entrada.addEventListener('input', mostrarSugestoes);
        // As setas descem do campo para os números, e andam entre eles.
        entrada.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' && sugestoesEl.firstElementChild) {
                e.preventDefault();
                sugestoesEl.querySelector('button').focus();
            } else if (e.key === 'Escape') {
                entrada.value = '';
                mostrarSugestoes();
            }
        });
        sugestoesEl.addEventListener('keydown', (e) => {
            const botoes = [...sugestoesEl.querySelectorAll('button')];
            const i = botoes.indexOf(document.activeElement);
            if (i < 0) return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                (botoes[i + 1] || botoes[i]).focus();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (i === 0) entrada.focus();
                else botoes[i - 1].focus();
            }
        });
        document.getElementById('procura').addEventListener('submit', (e) => {
            e.preventDefault();
            const q = normalizar(entrada.value);
            const casas = rede_.casas.get(q);
            if (casas && casas.length === 1) escolher(casas[0]);
            else if (!casas) {
                const lista = rede_.procurar(entrada.value, 2);
                if (lista.length === 1 && rede_.casas.get(lista[0]).length === 1) escolher(rede_.casas.get(lista[0])[0]);
                else mostrarSugestoes();
            } else mostrarSugestoes();
        });

        // ---- O que está no mapa por causa do percurso ----
        const marcadores = { inicio: null, destino: null };
        const tirarMarcador = (qual) => {
            if (marcadores[qual]) marcadores[qual].remove();
            marcadores[qual] = null;
        };
        const limparPercurso = () => {
            mapa.getSource('percurso').setData(NADA);
            mapa.getSource('tracejado').setData(NADA);
            tirarMarcador('inicio');
            tirarMarcador('destino');
        };
        document.getElementById('outra').addEventListener('click', () => {
            casaEscolhida = null;
            document.body.classList.remove('com-casa');
            limparPercurso();
            verNumeros();
            resultadoEl.hidden = true;
            entrada.value = '';
            mostrarSugestoes();
            history.replaceState(null, '', '/navegacao');
            escreverTitulo();
            entrada.focus();
        });

        // ---- Onde a pessoa está ----
        //
        // Só se pergunta ao telemóvel quando a pessoa carrega no botão. Com
        // a posição, o percurso parte dali e vai-se refazendo à medida que
        // anda; sem ela (ou longe do bairro), parte da entrada do bairro
        // mais perto da casa.
        let vigia = null;
        let aqui = null;
        let aquiDoPercurso = null;
        let marcadorAqui = null;
        let seguir = false;
        const pintarOndeEstou = () => {
            ondeEstouEl.classList.toggle('ligado', vigia !== null);
            ondeEstouEl.setAttribute('aria-pressed', vigia !== null ? 'true' : 'false');
        };
        const irPara = (sitio, zoom) => mapa.easeTo({ center: lngLat(sitio), zoom: Math.max(mapa.getZoom(), zoom), duration: 600 });
        const ondeEstou = (centrar) => {
            if (vigia !== null) {
                if (aqui && centrar) irPara([aqui.lat, aqui.lon], ZOOM_DE_PERTO);
                return;
            }
            if (!navigator.geolocation) {
                notaEl.textContent = diz('nav.semGps', 'Não foi possível saber onde está.');
                return;
            }
            seguir = !!centrar;
            notaEl.textContent = diz('nav.aProcurar', 'A procurar onde está…');
            vigia = navigator.geolocation.watchPosition((pos) => {
                const primeira = !aqui;
                aqui = { lat: pos.coords.latitude, lon: pos.coords.longitude, precisao: pos.coords.accuracy };
                const sitio = [aqui.lat, aqui.lon];
                mapa.getSource('precisao').setData(circulo(sitio, aqui.precisao));
                if (!marcadorAqui) {
                    const el = document.createElement('div');
                    el.className = 'voce';
                    el.setAttribute('role', 'img');
                    el.setAttribute('aria-label', diz('nav.voce', 'Está aqui'));
                    marcadorAqui = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(lngLat(sitio)).addTo(mapa);
                } else {
                    marcadorAqui.setLngLat(lngLat(sitio));
                }
                if (primeira && seguir) irPara(sitio, ZOOM_DE_PERTO);
                if (casaEscolhida) {
                    const mexeu = !aquiDoPercurso || distancia(sitio, [aquiDoPercurso.lat, aquiDoPercurso.lon]) > REFAZER_M;
                    if (mexeu) tracar(primeira);
                } else if (primeira) {
                    notaEl.textContent = '';
                }
            }, () => {
                navigator.geolocation.clearWatch(vigia);
                vigia = null;
                pintarOndeEstou();
                notaEl.textContent = diz('nav.semGps', 'Não foi possível saber onde está.');
                if (casaEscolhida) tracar(false);
            }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
            pintarOndeEstou();
        };
        ondeEstouEl.addEventListener('click', () => {
            if (vigia !== null && !aqui) return;
            if (vigia !== null && aqui) {
                irPara([aqui.lat, aqui.lon], ZOOM_DE_PERTO);
                return;
            }
            ondeEstou(true);
        });
        daquiEl.addEventListener('click', () => {
            if (vigia !== null && aqui) tracar(true);
            else ondeEstou(false);
        });

        // ---- O percurso ----
        let passosAtuais = [];
        let percursoAtual = null;

        const minutos = (metros) => Math.max(1, Math.round(metros / METROS_POR_MINUTO));

        const textoDoPasso = (p, numero) => {
            const m = { metros: p.metros, numero };
            const rua = p.rua || '';
            if (p.acao === 'inicio') {
                if (p.origem === 'aqui') return diz('nav.p.aqui', 'Comece onde está.');
                if (rua) return preencher(diz('nav.p.inicioRua', 'Comece {na} {rua}, à entrada do bairro.'), { na: prep('nav.na', rua), rua });
                return diz('nav.p.inicio', 'Comece na entrada do bairro, o quadrado no mapa.');
            }
            if (p.acao === 'chegada') {
                // Longe da rede: fora da zona do drone (as F), ou dentro dela
                // mas longe das ruas desenhadas (para dentro de um quarteirão).
                if (p.longe && p.fora) return preencher(diz('nav.p.longe', 'A casa {numero} fica a cerca de {metros} m, numa zona que o drone não fotografou: siga a linha a tracejado.'), { numero, metros: p.longe });
                if (p.longe) return preencher(diz('nav.p.longeDentro', 'A casa {numero} fica a cerca de {metros} m daqui, na direção da linha a tracejado.'), { numero, metros: p.longe });
                const chave = { esquerda: 'nav.p.chegadaEsquerda', direita: 'nav.p.chegadaDireita' }[p.lado] || 'nav.p.chegadaFrente';
                return preencher(diz(chave, 'Chegou: a casa {numero} fica à sua frente.'), m);
            }
            const pelaRua = rua ? ' ' + prep('nav.pela', rua) + ' ' + rua : '';
            const paraRua = rua ? ' ' + prep('nav.para', rua) + ' ' + rua : '';
            const chaves = {
                siga: ['nav.p.siga', 'Siga {metros} m{pelaRua}.'],
                esquerda: ['nav.p.esquerda', 'Vire à esquerda{paraRua} e siga {metros} m.'],
                direita: ['nav.p.direita', 'Vire à direita{paraRua} e siga {metros} m.'],
                ligeiraEsquerda: ['nav.p.ligeiraEsquerda', 'Mantenha-se à esquerda{paraRua} e siga {metros} m.'],
                ligeiraDireita: ['nav.p.ligeiraDireita', 'Mantenha-se à direita{paraRua} e siga {metros} m.'],
                volta: ['nav.p.volta', 'Volte para trás e siga {metros} m.']
            }[p.acao] || ['nav.p.siga', 'Siga {metros} m{pelaRua}.'];
            return preencher(diz(chaves[0], chaves[1]), { ...m, pelaRua, paraRua });
        };

        // O título do separador: a casa, quando há uma ("Casa D31 — Malha
        // Viva"); senão, o da página.
        const escreverTitulo = () => {
            document.title = casaEscolhida
                ? preencher(diz('nav.casa', 'Casa {numero}'), { numero: casaEscolhida.n }) + ' — ' + diz('site.nome', 'Malha Viva')
                : diz('nav.separador', 'Navegação') + ' — ' + diz('site.nome', 'Malha Viva');
        };

        const escreverPercurso = () => {
            if (!casaEscolhida || !percursoAtual) return;
            const n = casaEscolhida.n;
            casaNomeEl.textContent = preencher(diz('nav.casa', 'Casa {numero}'), { numero: n });
            const metros = arredondar(percursoAtual.total);
            const mins = minutos(percursoAtual.total);
            resumoEl.textContent = preencher(diz('nav.resumo', '{metros} m · cerca de {minutos} min a pé'), { metros, minutos: mins });
            const unidade = diz('nav.unidade', 'minuto|minutos').split('|')[mins === 1 ? 0 : 1];
            resumoLeitorEl.textContent = preencher(diz('nav.resumoLeitor', 'Percurso até à casa {numero}: {metros} metros, cerca de {minutos} {unidade} a pé.'), { numero: n, metros, minutos: mins, unidade });
            passosEl.innerHTML = '';
            passosAtuais.forEach((p) => {
                const li = document.createElement('li');
                li.textContent = textoDoPasso(p, n);
                if (p.acao === 'chegada') li.className = 'chegada';
                // Tocar num passo mostra-o no mapa.
                li.addEventListener('click', () => {
                    if (p.sitio) irPara(p.sitio, ZOOM_DO_PERCURSO);
                });
                passosEl.appendChild(li);
            });
            const ent = percursoAtual.entrada;
            comoChegarEl.hidden = !ent;
            if (ent) {
                comoChegarEl.href = 'https://www.google.com/maps/dir/?api=1&destination=' + ent[0].toFixed(6) + ',' + ent[1].toFixed(6);
            }
            escreverTitulo();
        };

        /**
         * Traça o percurso até à casa escolhida: de onde a pessoa está, se
         * se sabe e é perto; da entrada do bairro, se não.
         *
         * @param {boolean} enquadrar - Se o mapa vai mostrar o percurso todo.
         */
        const tracar = (enquadrar) => {
            const casa = casaEscolhida;
            if (!casa) return;
            let origem = null;
            let inicio = null;
            let ligacaoAqui = null;
            let entradaSitio = null;
            notaEl.textContent = '';
            if (aqui) {
                const perto = rede_.maisPerto(aqui.lat, aqui.lon);
                if (perto && perto.distancia <= LONGE_DO_BAIRRO_M) {
                    origem = { troco: perto.troco, ao: perto.ao };
                    inicio = { tipo: 'aqui' };
                    if (perto.distancia > FORA_DA_REDE_M) ligacaoAqui = [[aqui.lat, aqui.lon], perto.ponto];
                    aquiDoPercurso = { lat: aqui.lat, lon: aqui.lon };
                } else if (perto) {
                    notaEl.textContent = preencher(diz('nav.longe', 'Está longe do bairro: o percurso começa na entrada mais perto da casa.'), {});
                }
            }
            if (!origem) {
                const ent = rede_.entradaPara(casa.no);
                origem = { no: ent ? ent.no : casa.no };
                inicio = { tipo: 'entrada', rua: ent ? ent.rua : '' };
                entradaSitio = rede_.nos[origem.no];
            }
            const perc = rede_.caminho(origem, casa.no);
            if (!perc) return;
            const passos = rede_.indicacoes(perc, casa, inicio);
            // O sítio de cada passo, para o mostrar ao tocar nele.
            let s = 0;
            const pontoEm = (dist) => {
                let k = 1;
                while (k < perc.acum.length - 1 && perc.acum[k] < dist) k++;
                return perc.pontos[Math.min(k, perc.pontos.length - 1)];
            };
            for (const p of passos) {
                if (p.acao === 'inicio') p.sitio = perc.pontos[0];
                else if (p.acao === 'chegada') p.sitio = casa.ponto;
                else {
                    p.sitio = pontoEm(s);
                    s += p.metros;
                }
            }
            const fim = perc.pontos[perc.pontos.length - 1];
            percursoAtual = { total: perc.comprimento + distancia(fim, casa.porta), entrada: entradaSitio };
            passosAtuais = passos;

            // A linha, alisada ao longo de uns metros: as curvas e os
            // cruzamentos fazem-se em curva, sem cantos nem tremuras. Só o
            // desenho muda; as contas são feitas com o traçado de origem.
            const linha = alisar(perc.xy, ALISAR_M).map((q) => rede_.geo(q));
            mapa.getSource('percurso').setData(linhas([linha]));
            // Até à casa, a pontinhos: do fim da linha ao meio do telhado,
            // onde o número aponta (só se a casa não ficar mesmo ao pé).
            mapa.getSource('tracejado').setData(linhas([
                distancia(fim, casa.ponto) > 3 ? [fim, casa.ponto] : null,
                ligacaoAqui
            ]));
            // O princípio: a entrada, um quadrado com o nome.
            tirarMarcador('inicio');
            if (inicio.tipo === 'entrada' && linha.length > 1) {
                const el = document.createElement('div');
                el.className = 'inicio';
                el.setAttribute('role', 'img');
                el.setAttribute('aria-label', diz('nav.entrada', 'Entrada'));
                const nome = document.createElement('span');
                nome.className = 'nome';
                nome.setAttribute('aria-hidden', 'true');
                nome.textContent = diz('nav.entrada', 'Entrada');
                el.appendChild(nome);
                marcadores.inicio = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(lngLat(linha[0])).addTo(mapa);
            }
            // A casa: o número num quadrado branco, com o bico a apontar
            // para o telhado.
            tirarMarcador('destino');
            const el = document.createElement('div');
            el.className = 'destino';
            el.setAttribute('role', 'img');
            el.setAttribute('aria-label', preencher(diz('nav.casa', 'Casa {numero}'), { numero: casa.n }));
            const numero = document.createElement('span');
            numero.setAttribute('aria-hidden', 'true');
            numero.textContent = casa.n;
            el.appendChild(numero);
            marcadores.destino = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat(lngLat(casa.ponto)).addTo(mapa);

            escreverPercurso();
            if (enquadrar) {
                mostrarNoMapa(linha.concat([casa.ponto], ligacaoAqui || []), { maxZoom: ZOOM_DO_PERCURSO }, true);
            }
        };

        /**
         * Escolhe a casa e traça o percurso até lá.
         *
         * @param {object} casa - A casa (de rede.json).
         */
        const escolher = (casa) => {
            casaEscolhida = casa;
            document.body.classList.add('com-casa');
            entrada.value = casa.n;
            sugestoesEl.innerHTML = '';
            const repetidas = rede_.casas.get(casa.n);
            avisoEl.textContent = repetidas.length > 1
                ? preencher(diz('nav.repetido', 'O número {numero} aparece em {n} sítios no levantamento: escolha um.'), { numero: casa.n, n: repetidas.length })
                : '';
            if (repetidas.length > 1) mostrarSugestoes();
            resultadoEl.hidden = false;
            // No telemóvel, as indicações começam dobradas: o mapa primeiro.
            document.getElementById('indicacoes').open = window.innerWidth > 640;
            // O endereço da casa, que é o que se partilha: /casa/D31.
            history.replaceState(null, '', enderecoDaCasa(casa.n, repetidas.indexOf(casa) + 1, repetidas.length));
            tracar(true);
            verNumeros();
        };

        // ---- Partilhar ----
        //
        // O endereço de cada casa (malhaviva.pt/casa/D31) abre esta página
        // já com o percurso até ela: quem mora no bairro manda-o a quem o
        // vem visitar. No telemóvel abre a folha de partilhar do próprio
        // telemóvel (WhatsApp, mensagens...); no computador, copia.
        const podePartilhar = !!navigator.share && window.matchMedia('(pointer: coarse)').matches;
        const escreverPartilhar = () => {
            partilharEl.textContent = podePartilhar ? diz('nav.partilharCasa', 'Partilhar o endereço da casa') : diz('nav.copiarCasa', 'Copiar o endereço da casa');
        };
        partilharEl.addEventListener('click', async () => {
            if (!casaEscolhida) return;
            const url = window.location.origin + window.location.pathname;
            const titulo = preencher(diz('nav.casa', 'Casa {numero}'), { numero: casaEscolhida.n }) + ' — ' + diz('cab.bairro', 'Bairro de Penajóia');
            const texto = preencher(diz('nav.textoPartilha', 'Como chegar à casa {numero}, no Bairro de Penajóia:'), { numero: casaEscolhida.n });
            if (podePartilhar) {
                try { await navigator.share({ title: titulo, text: texto, url }); } catch (e) { /* desistiu */ }
                return;
            }
            try {
                await navigator.clipboard.writeText(url);
                partilharEl.textContent = diz('par.copiado', 'Ligação copiada');
                setTimeout(escreverPartilhar, 2000);
            } catch (e) {
                window.prompt(diz('nav.copiarCasa', 'Copiar o endereço da casa'), url);
            }
        });

        // ---- Ecrã inteiro ----
        const pintarBotaoDoEcra = (dentro) => {
            botaoEcra.innerHTML = dentro ? ICONE_SAIR_DO_ECRA : ICONE_ECRA_INTEIRO;
        };
        botaoEcra.addEventListener('click', () => {
            const alvo = document.documentElement;
            const entrar = alvo.requestFullscreen || alvo.webkitRequestFullscreen;
            const sair = document.exitFullscreen || document.webkitExitFullscreen;
            try {
                const pedido = (document.fullscreenElement || document.webkitFullscreenElement)
                    ? sair.call(document)
                    : entrar.call(alvo);
                if (pedido && pedido.catch) pedido.catch(() => {});
            } catch (e) { /* navegador sem ecrã inteiro: fica a janela */ }
        });
        document.addEventListener('fullscreenchange', () => pintarBotaoDoEcra(!!document.fullscreenElement));

        // ---- O teclado ----
        //
        // Fora do campo do número: o mais e o menos aproximam e afastam, o
        // zero volta à vista do bairro, as setas andam pelo mapa, o F vai a
        // ecrã inteiro.
        window.addEventListener('keydown', (e) => {
            if (e.altKey || e.ctrlKey || e.metaKey || e.defaultPrevented) return;
            const onde = e.target;
            if (onde && (onde.tagName === 'INPUT' || onde.closest('#painel'))) return;
            const tecla = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            const setas = {
                ArrowLeft: [-PASSO_DAS_SETAS, 0],
                ArrowRight: [PASSO_DAS_SETAS, 0],
                ArrowUp: [0, -PASSO_DAS_SETAS],
                ArrowDown: [0, PASSO_DAS_SETAS]
            };
            if (setas[tecla]) {
                e.preventDefault();
                mapa.panBy(setas[tecla], { duration: 200 });
            } else if (tecla === '+' || tecla === '=') {
                mapa.zoomIn({ duration: 300 });
            } else if (tecla === '-' || tecla === '_') {
                mapa.zoomOut({ duration: 300 });
            } else if (tecla === '0' || tecla === 'r') {
                vistaDoBairro(true);
            } else if (tecla === 'f') {
                botaoEcra.click();
            }
        });

        // ---- Os textos que mudam com a língua ----
        const escreverTextos = () => {
            entrada.placeholder = diz('nav.exemplo', 'p. ex. D31');
            creditosEl.innerHTML = '';
            const partes = preencher(diz('nav.creditos', 'Ortofotomapa: voo de drone de 15 de fevereiro de 2026, com as ruas desenhadas por cima · Satélite: {satelite} · Estradas à volta: {osm}'), { satelite: SATELITE.creditos, osm: '\u0000' }).split('\u0000');
            creditosEl.append(partes[0]);
            if (partes.length > 1) {
                const a = document.createElement('a');
                a.href = 'https://www.openstreetmap.org/copyright';
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = '© OpenStreetMap';
                creditosEl.append(a, partes[1]);
            }
            escreverPartilhar();
            if (!entrada.value) mostrarSugestoes();
            escreverPercurso();
            escreverTitulo();
            if (marcadores.inicio) {
                const el = marcadores.inicio.getElement();
                el.setAttribute('aria-label', diz('nav.entrada', 'Entrada'));
                el.querySelector('.nome').textContent = diz('nav.entrada', 'Entrada');
            }
            if (marcadorAqui) marcadorAqui.getElement().setAttribute('aria-label', diz('nav.voce', 'Está aqui'));
        };
        window.addEventListener('idiomamudou', escreverTextos);

        // ---- O ecrã de espera ----
        //
        // Sai quando o mapa acaba de desenhar a primeira vista, com as
        // fotografias todas; ou, se demorarem, ao fim de ESPERA_MAXIMA_MS —
        // mais vale um mapa a compor-se aos poucos do que um quadrado parado.
        let aberto = false;
        const abrir = () => {
            if (aberto) return;
            aberto = true;
            overlay.classList.add('escondido');
            pintarBotoesDoZoom();
            verNumeros();
        };
        mapa.once('idle', abrir);
        setTimeout(abrir, ESPERA_MAXIMA_MS);

        // ---- Começar ----
        pintarBotaoDoEcra(!!document.fullscreenElement);
        if (window.Idiomas) window.Idiomas.aplicar(document);
        escreverTextos();
        pintarBotoesDoZoom();
        pintarOndeEstou();
        // Um endereço com a casa já escolhida: /casa/D31 (ou ?casa=D31).
        const pedida = casaPedida(window.location);
        if (pedida && rede_.casas.has(pedida.numero)) {
            const lista = rede_.casas.get(pedida.numero);
            escolher(lista[Math.min(lista.length, pedida.sitio) - 1]);
        } else if (pedida) {
            entrada.value = pedida.numero;
            mostrarSugestoes();
        }
    </script>
</body>
</html>
