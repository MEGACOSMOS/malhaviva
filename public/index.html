<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bairro de Penajóia — Malha Viva</title>
    <meta name="description" content="Exploração 3D interativa do Bairro de Penajóia através de Gaussian Splatting. Projeto Malha Viva.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- PlayCanvas Web Components (versões fixas para estabilidade em produção) -->
    <script type="importmap">
        {
            "imports": {
                "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.21.4/build/playcanvas.mjs",
                "@playcanvas/web-components": "https://cdn.jsdelivr.net/npm/@playcanvas/web-components@0.15.0/dist/pwc.mjs"
            }
        }
    </script>
    <!-- Descarrega o motor e os componentes em paralelo (evita fila de espera) -->
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/playcanvas@2.21.4/build/playcanvas.mjs">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@playcanvas/web-components@0.15.0/dist/pwc.mjs">
    <script type="module">import '@playcanvas/web-components';</script>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #05050a;
            --color-surface: #12121c;
            --color-surface-hover: #1c1c2a;
            --color-text: #ffffff;
            --color-text-muted: rgba(255, 255, 255, 0.7);
            --color-accent: #ffffff;
            --color-accent-glow: rgba(255, 255, 255, 0.3);
            --color-border: rgba(255, 255, 255, 0.06);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --radius: 12px;
            --radius-sm: 8px;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--color-bg);
            font-family: var(--font-main);
            color: var(--color-text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ─── PlayCanvas App fills viewport ─── */
        pc-app {
            display: block;
            width: 100%;
            height: 100%;
            filter: saturate(90%);
        }

        /* ─── Loading Overlay ─── */
        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--color-bg);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        #loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .loading-logo {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--color-accent);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--color-text-muted);
            letter-spacing: 0.04em;
        }

        /* ─── Header ─── */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: transparent;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        #header.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #header > * {
            pointer-events: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--color-accent);
        }

        .brand-subtitle {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            font-weight: 400;
            letter-spacing: 0.02em;
        }



        /* ─── Coordinates Info ─── */
        #coordinates-info {
            position: fixed;
            top: 80px;
            left: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent), #05050a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateX(-10px);
            transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
            font-family: monospace;
            font-size: 0.8rem;
            pointer-events: none;
        }

        #coordinates-info.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* ─── Camera Info ─── */
        #camera-info {
            position: fixed;
            top: 205px;
            left: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent), #05050a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateX(-10px);
            transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
            font-family: monospace;
            font-size: 0.8rem;
            pointer-events: none;
        }

        #camera-info.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* ─── FPS Info ─── */
        #fps-info {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent), #05050a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            font-family: monospace;
            font-size: 0.9rem;
            pointer-events: none;
            color: var(--color-text);
        }

        #fps-info.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .fps-value {
            color: #10b981;
            font-weight: 700;
        }

        .coord-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 90px;
            color: var(--color-text);
        }

        .coord-label {
            color: var(--color-accent);
            font-weight: 700;
            margin-right: 12px;
        }

        /* ─── Responsive ─── */
        @media (max-width: 640px) {
            #header {
                padding: 12px 16px;
            }
        }

        /* ─── Settings ─── */
        .settings {
            position: relative;
        }
        
        #settings-btn, #dev-btn, #help-btn, #fullscreen-main-btn, #vr-btn {
            background: #05050a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-text);
            width: 40px;
            height: 40px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        #settings-btn:hover, #dev-btn:hover,
        .ceu-afinacao {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 0 2px;
            color: rgba(255,255,255,0.75);
            font-size: 0.8rem;
        }
        .ceu-afinacao b {
            color: #fff;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .ceu-numero {
            width: 84px;
            margin-left: 6px;
            background: rgba(0,0,0,0.4);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 3px 6px;
            font-family: inherit;
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }
        .ceu-numero:focus {
            outline: none;
            border-color: rgba(255,255,255,0.45);
        }
        .ceu-afinacao input[type="range"] {
            width: 100%;
            accent-color: #ffffff;
            cursor: pointer;
        }
        .ceu-botao {
            margin-top: 10px;
            background: transparent;
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            transition: background 0.2s;
        }
        .ceu-botao:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        #vr-btn.a-pedir-toque {
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.6);
            animation: vr-a-chamar 1.4s ease-in-out infinite;
        }
        @keyframes vr-a-chamar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
        #help-btn:hover, #fullscreen-main-btn:hover, #vr-btn:hover {
            background: rgba(255, 255, 255, 0.1) !important;
            color: var(--color-accent);
        }
        
        #settings-menu, #dev-menu {
            position: absolute;
            top: 50px;
            right: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent), #05050a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0;
            padding: 16px;
            width: 260px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: opacity 0.2s, transform 0.2s;
            transform-origin: top right;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.95);
        }
        
        #settings-menu.open, #dev-menu.open {
            pointer-events: auto;
            opacity: 1;
            transform: scale(1);
        }
        
        .settings-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .settings-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .settings-radio {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        
        .settings-radio input {
            accent-color: #05050a;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }



        /* ─── Camera Stuck Popup ─── */
        #camera-stuck-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 500;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent), #05050a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-radius: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        #camera-stuck-popup.visible {
            opacity: 1;
            visibility: visible;
        }

        .stuck-text {
            font-size: 1rem;
            font-weight: 500;
            color: var(--color-text);
        }
        
        .stuck-subtext {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-bottom: 8px;
        }

        #recenter-btn {
            background: #05050a;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 0;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s;
        }

        #recenter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        #recenter-btn:active {
            transform: scale(0.95);
        }

        /* ─── Filter Panel ─── */
        #filter-panel {
            position: fixed;
            top: 60px;
            right: 16px;
            width: 280px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent), #05050a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 1050;
            padding: 20px;
            display: none;
            font-family: var(--font-main);
        }
        #filter-panel.visible {
            display: block;
        }
        .filter-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #fff;
            margin-bottom: 16px;
        }
        .filter-row {
            margin-bottom: 14px;
        }
        .filter-row label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 6px;
        }
        .filter-row label span.filter-val {
            color: #fff;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .filter-row input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.15);
            outline: none;
            border-radius: 0;
        }
        .filter-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 0;
            cursor: pointer;
        }
        .filter-row input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #fff;
            border: none;
            border-radius: 0;
            cursor: pointer;
        }
        .filter-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .filter-actions button {
            flex: 1;
            padding: 8px 0;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            cursor: pointer;
            font-family: var(--font-main);
            transition: background 0.15s;
        }
        .filter-actions button:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ─── Vignette Overlay ─── */
        #vignette-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            /* Escurecimento suave nas margens: dá enquadramento sem tapar o
               que está à volta do bairro (a ponte, os pirilampos). */
            background: radial-gradient(
                ellipse at center,
                transparent 58%,
                rgba(5, 5, 10, 0.12) 76%,
                rgba(5, 5, 10, 0.32) 90%,
                rgba(5, 5, 10, 0.55) 100%
            );
        }
    </style>
</head>
<body>
    <!-- Vignette Overlay -->
    <div id="vignette-overlay"></div>

    <div id="debug-error" style="position:fixed; top:10px; left:10px; right:10px; color:#ff4444; z-index:9999; background:rgba(0,0,0,0.9); padding:15px; display:none; border: 1px solid red; font-family: monospace; white-space: pre-wrap;"></div>
    <script>
        window.addEventListener('error', function(e) {
            document.getElementById('debug-error').style.display = 'block';
            document.getElementById('debug-error').innerText += '[Error] ' + (e.message || e.error) + '\n';
        });
        window.addEventListener('unhandledrejection', function(e) {
            const errorMsg = e.reason && e.reason.message ? e.reason.message : (e.reason ? e.reason.toString() : '');
            if (errorMsg.includes('WebGL not supported')) {
                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                    overlay.innerHTML = `
                        <div class="loading-content" style="max-width: 400px; text-align: center; padding: 20px;">
                            <div style="color: #ef4444; margin-bottom: 16px;">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                                    <path d="M12 2L2 22h20L12 2z"></path>
                                    <line x1="12" y1="9" x2="12" y2="13"></line>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                            </div>
                            <div class="loading-logo" style="font-size: 24px; margin-bottom: 12px; animation: none; filter: none;">Aceleração Gráfica Necessária</div>
                            <div class="loading-text" style="line-height: 1.5; opacity: 0.9; text-transform: none; letter-spacing: normal;">O seu dispositivo ou navegador não suporta WebGL.<br><br>Por favor, certifique-se que tem a aceleração por hardware (hardware acceleration) ativada nas definições do seu navegador, ou tente aceder num dispositivo mais recente.</div>
                        </div>
                    `;
                    return; // Previne o debug error no ecrã
                }
            }
            
            document.getElementById('debug-error').style.display = 'block';
            document.getElementById('debug-error').innerText += '[Promise Rejection] ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '\n';
        });
    </script>

    <!-- Camera Stuck Popup -->
    <div id="camera-stuck-popup">
        <div class="stuck-text">Chegaste ao limite do mapa.</div>
        <div class="stuck-subtext">Não há terreno para lá desta zona.</div>
        <button id="recenter-btn">Recentrar Câmara</button>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="loading-content">
            <div class="loading-logo">Malha Viva</div>
            <div class="loading-spinner"></div>
            <div class="loading-text">A carregar modelo 3D…</div>
        </div>
    </div>

    <!-- Filter Panel -->
    <div id="filter-panel">
        <div class="filter-title">Filtro Visual</div>
        <div class="filter-row">
            <label>Saturação <span class="filter-val" id="val-saturate">90%</span></label>
            <input type="range" id="filter-saturate" min="0" max="200" value="90">
        </div>
        <div class="filter-row">
            <label>Brilho <span class="filter-val" id="val-brightness">100%</span></label>
            <input type="range" id="filter-brightness" min="0" max="200" value="100">
        </div>
        <div class="filter-row">
            <label>Contraste <span class="filter-val" id="val-contrast">100%</span></label>
            <input type="range" id="filter-contrast" min="0" max="200" value="100">
        </div>
        <div class="filter-row">
            <label>Matiz <span class="filter-val" id="val-hue">0°</span></label>
            <input type="range" id="filter-hue" min="0" max="360" value="0">
        </div>
        <div class="filter-row">
            <label>Sépia <span class="filter-val" id="val-sepia">0%</span></label>
            <input type="range" id="filter-sepia" min="0" max="100" value="0">
        </div>
        <div class="filter-actions">
            <button id="filter-reset">Repor</button>
            <button id="filter-apply">Aplicar</button>
        </div>
    </div>

    <!-- Header -->
    <div id="header">
        <div class="brand">
            <div class="brand-text">
                <span class="brand-name">Malha Viva</span>
            </div>
        </div>
        
        <div style="display: flex; align-items: center; gap: 8px;">
            <div class="settings" id="dev-menu-container">
                <button id="dev-btn" title="Menu de Desenvolvedor">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                </button>
                <div id="dev-menu" class="hidden">
                    <div class="settings-title">Menu de Desenvolvedor</div>
                    <div class="settings-options">
                        <label class="settings-radio">
                            <input type="checkbox" id="dev-trail-edit">
                            <span>Modo Edição de Trilha</span>
                        </label>
                        <label class="settings-radio">
                            <input type="checkbox" id="dev-filter">
                            <span>Painel Filtro Visual</span>
                        </label>
                        <label class="settings-radio">
                            <input type="checkbox" id="dev-cursor-coord">
                            <span>Posição do Cursor</span>
                        </label>
                        <label class="settings-radio">
                            <input type="checkbox" id="dev-camera-coord">
                            <span>Posição da Câmara</span>
                        </label>
                        <label class="settings-radio">
                            <input type="checkbox" id="dev-fps">
                            <span>Mostrar FPS</span>
                        </label>
                    </div>

                    <div class="settings-title" style="margin-top: 18px;">Céu (Olho de Águia)</div>
                    <div class="settings-options">
                        <label class="settings-radio">
                            <input type="checkbox" id="ceu-ligado" checked>
                            <span>Mostrar o céu</span>
                        </label>

                        <label class="ceu-afinacao">
                            <span>Rotação <b id="ceu-rotacao-valor">0°</b></span>
                            <input type="range" id="ceu-rotacao" min="0" max="360" step="1" value="0">
                        </label>

                        <label class="ceu-afinacao">
                            <span>Brilho <b id="ceu-brilho-valor">1.00</b></span>
                            <input type="range" id="ceu-brilho" min="0" max="2" step="0.05" value="1">
                        </label>

                        <label class="settings-radio">
                            <input type="checkbox" id="ceu-cupula">
                            <span>Assentar no chão (cúpula)</span>
                        </label>

                        <label class="ceu-afinacao" id="ceu-tamanho-linha">
                            <span>Tamanho da cúpula

    <!-- Este pedaço corre antes de o motor 3D arrancar, e é de propósito:
         o anti-serrilhado e a densidade de pixéis só podem ser escolhidos
         no momento em que o motor é criado. Decididos mais tarde, como
         estavam, ficavam sem efeito — o nível Médio andava a desenhar com
         anti-serrilhado e a mais de duas vezes os pixéis do ecrã. -->
    <script>
        (function () {
            function detetarNivel() {
                var telemovel = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                var ecraPequeno = window.matchMedia('(max-width: 768px)').matches;
                var toque = (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0);
                if (telemovel || (ecraPequeno && toque)) return 'low';
                var nucleos = navigator.hardwareConcurrency || 4;
                return nucleos <= 6 ? 'med' : 'high';
            }

            var guardada = null;
            try { guardada = localStorage.getItem('quality'); } catch (e) { guardada = null; }
            var nivel = (!guardada || guardada === 'auto') ? detetarNivel() : guardada;
            window.actualQuality = nivel;

            // O modo VR pede o motor de desenho antigo (WebGL2): é o único
            // que os óculos sabem receber. Quando se entra em VR a página
            // recarrega-se com esta marca no endereço, e é aqui que ela é
            // respeitada — tem de ser antes de o motor nascer.
            var pedido = new URLSearchParams(window.location.search);
            window.modoVRpedido = pedido.get('vr') === '1';
            if (window.modoVRpedido) {
                var motorVR = document.getElementById('main-app');
                if (motorVR) motorVR.setAttribute('backend', 'webgl2');
            }

            if (nivel !== 'high') {
                var motor = document.getElementById('main-app');
                if (motor) {
                    motor.setAttribute('antialias', 'false');

                    // Um ponto do modelo por cada ponto do ecrã. Num
                    // telemóvel isto é já um terço dos pontos que ele tem,
                    // e é a maior poupança que há sem tocar na imagem.
                    // Em ecrãs grandes desce ainda mais, para o trabalho
                    // não crescer com o tamanho do ecrã.
                    var densidade = 1;
                    if (nivel === 'low') {
                        var pontosDoEcra = Math.max(1, window.innerWidth * window.innerHeight);
                        densidade = Math.min(1, Math.sqrt(900000 / pontosDoEcra));
                    }
                    motor.setAttribute('max-pixel-ratio', densidade.toFixed(3));
                }
                // Nos níveis Médio e Baixo entra o modelo do bairro já
                // aligeirado de origem.
                var mapa = document.getElementById('splat-scene');
                if (mapa) mapa.setAttribute('src', 'splat_perf/lod-meta.json');
            }
        })();
    </script>

    <script type="module">
        import { whenReady } from '@playcanvas/web-components';
        import {
            Vec3, Texture,
            PIXELFORMAT_RGBA8, FILTER_LINEAR, ADDRESS_CLAMP_TO_EDGE
        } from 'playcanvas';
        import { ligarLodNoCentroDaVista } from './lod-foco.mjs?v=3';
        import { criarModoVR } from './vr.mjs?v=3';
        import { ligarCeu } from './ceu.mjs?v=3';

        // Resolução da grelha usada para medir o mapa, em metros.
        const RESOLUCAO_LIMITE = 4;

        // Ao longo de quantos metros o terreno se desvanece junto à borda.
        // Quanto maior, mais para dentro do mapa começa a difusão.
        const LARGURA_DESVANECIMENTO = 90;

        // Até onde a câmara pode passar para lá da última casa, em metros.
        const TOLERANCIA_FORA_DO_MAPA = 15;

        /**
         * Mede o mapa uma única vez e usa essa medida para as duas coisas que
         * dependem da forma do bairro: o desvanecimento das bordas e o limite
         * de onde a câmara pode andar.
         *
         * Só o plano horizontal é limitado — a altura mantém os limites de
         * sempre, para a vista inicial de cima continuar a funcionar.
         */
        async function aplicarLimitesDoMapa(app) {
            try {
                const src = document.getElementById('splat-scene').getAttribute('src');
                const meta = await (await fetch(src)).json();
                if (!meta || !meta.tree) return;

                const splat = app.root.findByName('gsplat-scene');
                const camera = app.root.findByName('camera');
                const controls = camera && camera.script && camera.script.cameraControls;
                if (!splat) return;

                // O modelo divide-se numa árvore de zonas; as pontas dessa
                // árvore dizem onde há terreno de facto.
                const zonas = [];
                (function recolher(no) {
                    if (!no.children || no.children.length === 0) {
                        if (no.bound) zonas.push(no.bound);
                        return;
                    }
                    no.children.forEach(recolher);
                })(meta.tree);
                if (zonas.length === 0) return;

                // O mapa está rodado, por isso cada zona é convertida para
                // coordenadas do mundo e reduzida à sua planta (X e Z).
                app.root.syncHierarchy();
                const matrix = splat.getWorldTransform();
                const corner = new Vec3();
                let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;

                const plantas = zonas.map((b) => {
                    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
                    for (let i = 0; i < 8; i++) {
                        corner.set(
                            i & 1 ? b.max[0] : b.min[0],
                            i & 2 ? b.max[1] : b.min[1],
                            i & 4 ? b.max[2] : b.min[2]
                        );
                        matrix.transformPoint(corner, corner);
                        x0 = Math.min(x0, corner.x); x1 = Math.max(x1, corner.x);
                        z0 = Math.min(z0, corner.z); z1 = Math.max(z1, corner.z);
                    }
                    minX = Math.min(minX, x0); maxX = Math.max(maxX, x1);
                    minZ = Math.min(minZ, z0); maxZ = Math.max(maxZ, z1);
                    return { x0, x1, z0, z1 };
                });

                // Grelha com folga larga: além do mapa, tem de conseguir medir
                // distâncias maiores, para saber onde está a vista de abertura.
                const folga = Math.ceil(160 / RESOLUCAO_LIMITE) + 2;
                const colunas = Math.ceil((maxX - minX) / RESOLUCAO_LIMITE) + folga * 2;
                const linhas = Math.ceil((maxZ - minZ) / RESOLUCAO_LIMITE) + folga * 2;
                const origemX = minX - folga * RESOLUCAO_LIMITE;
                const origemZ = minZ - folga * RESOLUCAO_LIMITE;
                const total = colunas * linhas;

                // Marca as células que têm terreno
                const terreno = new Uint8Array(total);
                for (const p of plantas) {
                    const a = Math.floor((p.x0 - origemX) / RESOLUCAO_LIMITE);
                    const b = Math.floor((p.x1 - origemX) / RESOLUCAO_LIMITE);
                    const c = Math.floor((p.z0 - origemZ) / RESOLUCAO_LIMITE);
                    const d = Math.floor((p.z1 - origemZ) / RESOLUCAO_LIMITE);
                    for (let j = c; j <= d; j++) {
                        for (let i = a; i <= b; i++) terreno[j * colunas + i] = 1;
                    }
                }

                // Um pátio ou clareira sem pontos no modelo abriria um buraco
                // no meio do bairro. Tudo o que esteja rodeado por terreno
                // passa a contar como terreno.
                preencherBuracos(terreno, colunas, linhas);

                // Profundidade de cada ponto para dentro do terreno
                const dentro = distanciaAte(terreno, colunas, linhas, false);

                // Bordas suaves usam essa profundidade tal como está
                aplicarBordasSuaves(app, splat, {
                    dentro, colunas, linhas, origemX, origemZ, celula: RESOLUCAO_LIMITE
                });

                if (!controls) return;

                // A câmara pode passar um pouco para lá da última casa
                const fora = distanciaAte(terreno, colunas, linhas, true);
                const tolerancia = TOLERANCIA_FORA_DO_MAPA / RESOLUCAO_LIMITE;
                const permitido = new Uint8Array(total);
                for (let k = 0; k < total; k++) permitido[k] = fora[k] <= tolerancia ? 1 : 0;
                preencherBuracos(permitido, colunas, linhas);

                // Distância de qualquer ponto à zona onde a câmara pode andar
                const distanciaAoPermitido = distanciaAte(permitido, colunas, linhas, true);

                const indice = (x, z) => {
                    const i = Math.floor((x - origemX) / RESOLUCAO_LIMITE);
                    const j = Math.floor((z - origemZ) / RESOLUCAO_LIMITE);
                    if (i < 0 || j < 0 || i >= colunas || j >= linhas) return -1;
                    return j * colunas + i;
                };

                controls.setPlayArea({
                    // Dentro da zona onde a câmara pode andar
                    contains(x, z) {
                        const k = indice(x, z);
                        return k >= 0 && permitido[k] === 1;
                    },
                    // A que distância está dessa zona
                    distanceTo(x, z) {
                        const k = indice(x, z);
                        if (k < 0) return Infinity;
                        return distanciaAoPermitido[k] * RESOLUCAO_LIMITE;
                    }
                });
            } catch (e) {
                console.warn('Não foi possível ler os contornos do mapa:', e);
            }
        }

        /** Marca como cheio tudo o que esteja rodeado por células cheias. */
        function preencherBuracos(celulas, colunas, linhas) {
            const exterior = new Uint8Array(celulas.length);
            const porVer = [0];
            exterior[0] = 1;
            while (porVer.length > 0) {
                const k = porVer.pop();
                const i = k % colunas;
                const j = (k - i) / colunas;
                if (i > 0) { const n = k - 1; if (!exterior[n] && !celulas[n]) { exterior[n] = 1; porVer.push(n); } }
                if (i < colunas - 1) { const n = k + 1; if (!exterior[n] && !celulas[n]) { exterior[n] = 1; porVer.push(n); } }
                if (j > 0) { const n = k - colunas; if (!exterior[n] && !celulas[n]) { exterior[n] = 1; porVer.push(n); } }
                if (j < linhas - 1) { const n = k + colunas; if (!exterior[n] && !celulas[n]) { exterior[n] = 1; porVer.push(n); } }
            }
            for (let k = 0; k < celulas.length; k++) {
                if (!celulas[k] && !exterior[k]) celulas[k] = 1;
            }
        }

        /**
         * Distância de cada célula da grelha ao conjunto marcado, em células.
         * Com `porFora`, mede de fora até ao conjunto; sem, mede a profundidade
         * dentro do próprio conjunto. Duas passagens, ida e volta.
         */
        function distanciaAte(celulas, colunas, linhas, porFora) {
            const DIAGONAL = Math.SQRT2;
            const d = new Float32Array(celulas.length);
            for (let k = 0; k < d.length; k++) {
                const cheio = celulas[k] === 1;
                d[k] = (porFora ? cheio : !cheio) ? 0 : 1e9;
            }
            for (let j = 0; j < linhas; j++) {
                for (let i = 0; i < colunas; i++) {
                    const k = j * colunas + i;
                    let v = d[k];
                    if (i > 0) v = Math.min(v, d[k - 1] + 1);
                    if (j > 0) v = Math.min(v, d[k - colunas] + 1);
                    if (i > 0 && j > 0) v = Math.min(v, d[k - colunas - 1] + DIAGONAL);
                    if (i < colunas - 1 && j > 0) v = Math.min(v, d[k - colunas + 1] + DIAGONAL);
                    d[k] = v;
                }
            }
            for (let j = linhas - 1; j >= 0; j--) {
                for (let i = colunas - 1; i >= 0; i--) {
                    const k = j * colunas + i;
                    let v = d[k];
                    if (i < colunas - 1) v = Math.min(v, d[k + 1] + 1);
                    if (j < linhas - 1) v = Math.min(v, d[k + colunas] + 1);
                    if (i < colunas - 1 && j < linhas - 1) v = Math.min(v, d[k + colunas + 1] + DIAGONAL);
                    if (i > 0 && j < linhas - 1) v = Math.min(v, d[k + colunas - 1] + DIAGONAL);
                    d[k] = v;
                }
            }
            return d;
        }

        /**
         * Faz o mapa desvanecer-se junto às bordas em vez de acabar a direito.
         * A medida de profundidade é entregue ao programa gráfico como uma
         * pequena imagem; cada ponto do mapa consulta-a e esbate-se conforme
         * está perto da orla.
         */
        function aplicarBordasSuaves(app, splat, grelha) {
            // No nivel Baixo fica desligado: poupa o trabalho extra por cada
            // ponto do mapa e a imagem de bordas que o acompanha.
            if (window.actualQuality === 'low') return;

            const comp = splat && splat.gsplat;
            if (!comp || !comp.setWorkBufferModifier) return;

            const { dentro, colunas, linhas, origemX, origemZ, celula } = grelha;
            const total = colunas * linhas;

            const pixeis = new Uint8Array(total * 4);
            for (let k = 0; k < total; k++) {
                const metros = dentro[k] * celula;
                const v = Math.round(255 * Math.min(1, metros / LARGURA_DESVANECIMENTO));
                const p = k * 4;
                pixeis[p] = v; pixeis[p + 1] = v; pixeis[p + 2] = v; pixeis[p + 3] = 255;
            }

            const textura = new Texture(app.graphicsDevice, {
                name: 'mapaBordas',
                width: colunas,
                height: linhas,
                format: PIXELFORMAT_RGBA8,
                minFilter: FILTER_LINEAR,
                magFilter: FILTER_LINEAR,
                addressU: ADDRESS_CLAMP_TO_EDGE,
                addressV: ADDRESS_CLAMP_TO_EDGE,
                mipmaps: false
            });
            textura.lock().set(pixeis);
            textura.unlock();
            comp.setParameter('uMapaBordas', textura);

            const larguraMundo = (colunas * celula).toFixed(3);
            const alturaMundo = (linhas * celula).toFixed(3);
            const ox = origemX.toFixed(3);
            const oz = origemZ.toFixed(3);

            const wgsl = `
var uMapaBordas: texture_2d<f32>;
var uMapaBordasSampler: sampler;
fn modifySplatCenter(center: ptr<function, vec3f>) {}
fn modifySplatRotationScale(originalCenter: vec3f, modifiedCenter: vec3f, rotation: ptr<function, vec4f>, scale: ptr<function, vec3f>) {}
fn modifySplatColor(center: vec3f, color: ptr<function, vec4f>) {
    let uv = vec2f((center.x - (${ox})) / ${larguraMundo}, (center.z - (${oz})) / ${alturaMundo});
    let d = textureSampleLevel(uMapaBordas, uMapaBordasSampler, uv, 0.0).r;
    (*color).a = (*color).a * smoothstep(0.0, 1.0, d);
}`;

            const glsl = `
uniform sampler2D uMapaBordas;
void modifySplatCenter(inout vec3 center) {}
void modifySplatRotationScale(vec3 originalCenter, vec3 modifiedCenter, inout vec4 rotation, inout vec3 scale) {}
void modifySplatColor(vec3 center, inout vec4 color) {
    vec2 uv = vec2((center.x - (${ox})) / ${larguraMundo}, (center.z - (${oz})) / ${alturaMundo});
    float d = texture(uMapaBordas, uv).r;
    color.a = color.a * smoothstep(0.0, 1.0, d);
}`;

            comp.setWorkBufferModifier({ wgsl: wgsl, glsl: glsl });
        }

        // Wait for the PlayCanvas app to be ready, then hide the loading overlay
        const overlay = document.getElementById('loading-overlay');
        const header = document.getElementById('header');

        // Quality Management
        function detectTier() {
            const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isSmallScreen = window.matchMedia("(max-width: 768px)").matches;
            const isTouch = (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0);
            
            const isMobile = isMobileUA || (isSmallScreen && isTouch);
            if (isMobile) return 'low';
            
            const cores = navigator.hardwareConcurrency || 4;
            if (cores <= 6) return 'med';
            
            return 'high';
        }

        let savedQuality = localStorage.getItem('quality') || 'auto';

        // O nível já foi decidido antes de o motor arrancar (ver o pequeno
        // script a seguir à cena); aqui é só lido.
        const actualQuality = window.actualQuality ||
            (savedQuality === 'auto' ? detectTier() : savedQuality);
        window.actualQuality = actualQuality;
        const isHigh = actualQuality === 'high';
        const isMed = actualQuality === 'med';
        const isLow = actualQuality === 'low';
        
        // Setup initial UI states
        document.getElementById('radio-auto').checked = (savedQuality === 'auto');
        document.getElementById('radio-high').checked = (savedQuality === 'high');
        document.getElementById('radio-med').checked = (savedQuality === 'med');
        document.getElementById('radio-low').checked = (savedQuality === 'low');
        

        function showUI() {
            overlay.classList.add('hidden');
            header.classList.add('visible');

            // Aplica a escolha guardada de que anotações mostrar
            aplicarVisibilidadeAnotacoes();
            
            // Adjust SOG LOD settings and apply performance budgets
            try {
                const pcApp = document.querySelector('pc-app');
                const app = pcApp && pcApp.app;

                // --- Limita a densidade de pixels a 2x no nível Alto: acima disso
                //     não há ganho visível de nitidez, só custo de renderização ---
                if (isHigh && app && app.graphicsDevice) {
                    app.graphicsDevice.maxPixelRatio = Math.min(window.devicePixelRatio, 2);
                }

                // --- Nível Baixo: menos pixéis para desenhar ---
                // A ponte e os pirilampos deixaram de ser apagados aqui: agora
                // que são agrupados num punhado de desenhos, cabem em todos os
                // níveis de qualidade e fazem parte do cenário à volta.
                //
                // Um telemóvel desenha à medida do ecrã (um ponto por ponto),
                // o que já é bem menos do que os dois ou três pontos por
                // ponto que ele tem. Em ecrãs grandes — um tablet deitado,
                // por exemplo — nem isso chega, e há um tecto de pontos para
                // o trabalho não crescer com o tamanho do ecrã.
                if (!isHigh && app && app.graphicsDevice) {
                    let densidade = 1;
                    if (isLow) {
                        const pontosDoEcra = Math.max(1, window.innerWidth * window.innerHeight);
                        const TECTO_DE_PONTOS = 900000;
                        densidade = Math.min(1, Math.sqrt(TECTO_DE_PONTOS / pontosDoEcra));
                    }
                    app.graphicsDevice.maxPixelRatio = densidade;
                }

                // --- 3D Fog removed (may cause LOD issues with GSplat) ---

                // --- Adjust far clip based on quality, but keep it huge for the background elements ---
                if (isLow || isMed) {
                    const cameraEntity = app && app.root && app.root.findByName('camera');
                    if (cameraEntity && cameraEntity.camera) {
                        cameraEntity.camera.farClip = isLow ? 10000 : 25000;
                    }
                }

                // --- Per-asset LOD tuning ---
                const splatEl = document.querySelector('pc-entity[name="gsplat-scene"]');
                if (splatEl && splatEl.entity && splatEl.entity.gsplat) {
                    // As distâncias abaixo encolheram um pouco desde que o
                    // detalhe deixou de andar colado à câmara: como agora
                    // assenta onde a pessoa está a olhar, chega menos raio
                    // para a vista ficar mais nítida do que estava.
                    if (isHigh) {
                        splatEl.entity.gsplat.lodBaseDistance = 250; 
                        splatEl.entity.gsplat.lodMultiplier = 3; 
                    } else if (isMed) {
                        splatEl.entity.gsplat.lodBaseDistance = 70; 
                        splatEl.entity.gsplat.lodMultiplier = 3; 
                    } else { // isLow
                        splatEl.entity.gsplat.lodBaseDistance = 20; 
                        splatEl.entity.gsplat.lodMultiplier = 8; 
                    }

                    // Tecto de pontos no ecrã. Fica na cena e não no mapa:
                    // escrito no mapa, como estava, o motor ignorava-o e o
                    // limite nunca chegou a existir. Nas vistas mais largas
                    // é ele que aperta o detalhe sozinho, em vez de deixar
                    // a imagem começar a arrastar.
                    if (app && app.scene && app.scene.gsplat) {
                        if (isMed) app.scene.gsplat.splatBudget = 1200000;
                        else if (isLow) app.scene.gsplat.splatBudget = 500000;
                    }

                    // --- Nível Baixo: poupar onde não se dá por isso ---
                    //
                    // Num telemóvel o que custa não é tanto o número de
                    // manchas do modelo, é a quantidade de vezes que cada
                    // ponto do ecrã é pintado por manchas transparentes
                    // sobrepostas. Estas três afinações atacam exactamente
                    // isso, e todas elas deitam fora manchas que quase não
                    // se vêem:
                    //
                    //  - manchas com menos de três pontos de raio no ecrã
                    //    são pó, e o pó só serve para pintar por cima;
                    //  - manchas que mal contribuem para a cor final saem
                    //    da conta;
                    //  - e, fora do meio do ecrã, essa exigência aumenta a
                    //    pouco e pouco. Ao centro nada muda; é nos cantos,
                    //    onde a atenção não está, que se poupa.
                    if (isLow && app && app.scene && app.scene.gsplat) {
                        const g = app.scene.gsplat;
                        g.minPixelSize = 3;
                        g.minContribution = 5;
                        g.foveationCenter = 0.4;
                        g.foveationStrength = 10;
                    }
                }
            } catch(e) {
                console.warn("Performance setup error:", e);
            }
        }

        // --- Anotações: ligar/desligar cada tipo ---

        function aplicarVisibilidadeAnotacoes() {

            // --- Modo VR ---
            // O botão só aparece a quem tenha óculos; a quem não tenha, não

            /**
             * Liga os comandos do céu do menu de desenvolvedor.
             *
             * @param {object} ceu - O céu devolvido por ligarCeu.
             */
            function ligarComandosDoCeu(ceu) {
                const d = ceu.definicoes;
                const ligado = document.getElementById('ceu-ligado');
                const rotacao = document.getElementById('ceu-rotacao');
                const brilho = document.getElementById('ceu-brilho');
                const cupula = document.getElementById('ceu-cupula');
                const tamanho = document.getElementById('ceu-tamanho');
                const altura = document.getElementById('ceu-altura');
                const deslocX = document.getElementById('ceu-x');
                const deslocZ = document.getElementById('ceu-z');
                const reiniciar = document.getElementById('ceu-reiniciar');
                if (!ligado) return;

                const tamanhoEscrito = document.getElementById('ceu-tamanho-valor');
                const alturaEscrita = document.getElementById('ceu-altura-valor');
                const xEscrito = document.getElementById('ceu-x-valor');
                const zEscrito = document.getElementById('ceu-z-valor');

                /**
                 * Alarga a barra quando se escreve um valor que ela não
                 * alcança. Assim o número escrito manda sempre, e a barra
                 * continua a servir para afinar à volta dele.
                 *
                 * @param {HTMLInputElement} barra - A barra a alargar.
                 * @param {number} valor - O valor escrito.
                 */
                const acomodar = (barra, valor) => {
                    if (valor < parseFloat(barra.min)) barra.min = valor;
                    if (valor > parseFloat(barra.max)) barra.max = valor;
                };

                /** Escreve nos comandos o que está em vigor. */
                const mostrar = () => {
                    ligado.checked = d.ligado;
                    rotacao.value = d.rotacao;
                    brilho.value = d.brilho;
                    cupula.checked = d.cupula;
                    acomodar(tamanho, d.tamanhoDaCupula);
                    acomodar(altura, d.alturaDaCupula);
                    acomodar(deslocX, d.deslocamentoX);
                    acomodar(deslocZ, d.deslocamentoZ);
                    tamanho.value = d.tamanhoDaCupula;
                    altura.value = d.alturaDaCupula;
                    deslocX.value = d.deslocamentoX;
                    deslocZ.value = d.deslocamentoZ;
                    document.getElementById('ceu-rotacao-valor').innerText = Math.round(d.rotacao) + '°';
                    document.getElementById('ceu-brilho-valor').innerText = Number(d.brilho).toFixed(2);
                    // A caixa escrita não é tocada enquanto lá se está a
                    // escrever: senão apagava os números a meio da frase.
                    if (document.activeElement !== tamanhoEscrito) tamanhoEscrito.value = arredondar(d.tamanhoDaCupula);
                    if (document.activeElement !== alturaEscrita) alturaEscrita.value = arredondar(d.alturaDaCupula);
                    if (document.activeElement !== xEscrito) xEscrito.value = arredondar(d.deslocamentoX);
                    if (document.activeElement !== zEscrito) zEscrito.value = arredondar(d.deslocamentoZ);
                    // As medidas da cúpula só interessam com a cúpula ligada.
                    const visivel = d.cupula ? '' : 'none';
                    ['ceu-tamanho-linha', 'ceu-altura-linha', 'ceu-x-linha', 'ceu-z-linha']
                        .forEach(id => { document.getElementById(id).style.display = visivel; });
                };

                /**
                 * Corta as casas decimais que não dizem nada, para a caixa
                 * mostrar 600 e não 600.0000001.
                 *
                 * @param {number} valor - O número a arrumar.
                 * @returns {number} O mesmo número, sem lixo no fim.
                 */
                function arredondar(valor) {
                    return Math.round(valor * 1000) / 1000;
                }

                /**
                 * Liga uma caixa de escrita à afinação correspondente.
                 *
                 * @param {HTMLInputElement} caixa - Onde se escreve.
                 * @param {HTMLInputElement} barra - A barra a acompanhar.
                 * @param {string} campo - Nome da afinação.
                 */
                const ligarEscrita = (caixa, barra, campo) => {
                    const aplicar = () => {
                        // Escreve-se com vírgula ou com ponto, tanto faz.
                        const valor = parseFloat(caixa.value.replace(',', '.'));
                        if (!isFinite(valor)) return;
                        acomodar(barra, valor);
                        ceu.afinar(campo, valor);
                        mostrar();
                    };
                    caixa.addEventListener('input', aplicar);
                    // Ao sair da caixa, o que lá está é arrumado — mesmo que
                    // tenha ficado vazia ou com um rabisco.
                    caixa.addEventListener('blur', mostrar);
                    caixa.addEventListener('keydown', (e) => { if (e.key === 'Enter') caixa.blur(); });
                };

                ligado.addEventListener('change', () => { ceu.afinar('ligado', ligado.checked); mostrar(); });
                cupula.addEventListener('change', () => { ceu.afinar('cupula', cupula.checked); mostrar(); });
                rotacao.addEventListener('input', () => { ceu.afinar('rotacao', parseFloat(rotacao.value)); mostrar(); });
                brilho.addEventListener('input', () => { ceu.afinar('brilho', parseFloat(brilho.value)); mostrar(); });
                tamanho.addEventListener('input', () => { ceu.afinar('tamanhoDaCupula', parseFloat(tamanho.value)); mostrar(); });
                altura.addEventListener('input', () => { ceu.afinar('alturaDaCupula', parseFloat(altura.value)); mostrar(); });
                deslocX.addEventListener('input', () => { ceu.afinar('deslocamentoX', parseFloat(deslocX.value)); mostrar(); });
                deslocZ.addEventListener('input', () => { ceu.afinar('deslocamentoZ', parseFloat(deslocZ.value)); mostrar(); });
                ligarEscrita(tamanhoEscrito, tamanho, 'tamanhoDaCupula');
                ligarEscrita(alturaEscrita, altura, 'alturaDaCupula');
                ligarEscrita(xEscrito, deslocX, 'deslocamentoX');
                ligarEscrita(zEscrito, deslocZ, 'deslocamentoZ');
                reiniciar.addEventListener('click', () => { ceu.reiniciar(); mostrar(); });

                mostrar();
            }

            /**
             * Mostra um aviso curto quando os óculos não abrem.
             *
             * @param {string} texto - O que dizer à pessoa.

            function avisarVR(texto) {

    <script>

            contrast:   { el: document.getElementById('filter-contrast'),   valEl: document.getElementById('val-contrast'),   unit: '%', def: 100 },
            hue:        { el: document.getElementById('filter-hue'),        valEl: document.getElementById('val-hue'),        unit: '°', def: 0 },
            sepia:      { el: document.getElementById('filter-sepia'),      valEl: document.getElementById('val-sepia'),      unit: '%', def: 0 },
        };

        function buildFilter() {
            const s = sliders.saturate.el.value;
            const b = sliders.brightness.el.value;
            const c = sliders.contrast.el.value;
            const h = sliders.hue.el.value;
            const sp = sliders.sepia.el.value;
            return `saturate(${s}%) brightness(${b}%) contrast(${c}%) hue-rotate(${h}deg) sepia(${sp}%)`;
        }

        function applyFilter() {
            if (pcAppEl) pcAppEl.style.filter = buildFilter();
        }

        function updateLabels() {
            Object.values(sliders).forEach(s => {
                s.valEl.innerText = s.el.value + s.unit;
            });
        }

        Object.values(sliders).forEach(s => {
            s.el.addEventListener('input', () => {
                updateLabels();
                applyFilter();
            });
        });

        document.getElementById('filter-reset').addEventListener('click', () => {
            for (const key in sliders) {
                sliders[key].el.value = sliders[key].def;
            }
            updateLabels();
            if (pcAppEl) pcAppEl.style.filter = 'none';
        });

        // Apply button (close panel and keep filter)
        document.getElementById('filter-apply').addEventListener('click', () => {
            applyFilter();
            filterPanel.classList.remove('visible');
        });
    })();
    </script>

</body>
</html>
