<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Video Player</title>
    <script src="/idiomas.js?v=1"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent('fix-seam', {
            init: function () {
                this.el.addEventListener('materialtextureloaded', () => {
                    const mesh = this.el.getObject3D('mesh');
                    if (mesh && mesh.material && mesh.material.map) {
                        mesh.material.map.wrapS = THREE.RepeatWrapping;
                        mesh.material.map.needsUpdate = true;
                    }
                });
            }
        });
    </script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #05050a; overflow: hidden; font-family: sans-serif; }
        
        body.hide-cursor, body.hide-cursor * {
            cursor: none !important;
        }

        /* ─── Play Initial Overlay ─── */
        #play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #play-btn-initial {
            background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.15); padding: 15px 40px; border-radius: 0;
            font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 10px;
            backdrop-filter: blur(8px);
        }
        #play-btn-initial:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }

        /* Quando é só para começar a ver, o botão é o mesmo círculo dos
           outros vídeos do bairro. A tarja larga com letras fica reservada
           para o convite a entrar nos óculos, que é outra coisa. */
        #play-btn-initial.play-redondo {
            background: rgba(0,0,0,0.6);
            border: none;
            border-radius: 50%;
            width: 70px; height: 70px;
            padding: 0;
            gap: 0;
            font-size: 0;
            box-shadow: none;
            backdrop-filter: none;
            justify-content: center;
        }
        #play-btn-initial.play-redondo:hover { background: rgba(0,0,0,0.75); transform: scale(1.1); }
        .spinner {
            width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ─── Custom UI Overlay ─── */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000; pointer-events: none;
        }
        
        /* --- Big Play Button --- */
        .big-play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            width: 70px; height: 70px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: white;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
        }
        #ui-layer.paused .big-play-btn {
            opacity: 1;
            pointer-events: auto;
        }
        #ui-layer.paused .big-play-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            color: #ffffff;
        }

        /* --- Controls Bar --- */
        .video-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 30px 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .video-controls.active {
            opacity: 1;
            pointer-events: auto;
        }
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            border-radius: 0;
            position: relative;
        }
        .progress-filled {
            height: 100%;
            background: #ffffff;
            width: 0%;
            border-radius: 0;
            pointer-events: none;
            transition: width 0.1s linear;
        }
        .controls-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .player-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            transition: 0.2s ease;
            padding: 0;
        }
        .player-btn:hover {
            opacity: 1;
            color: #ffffff;
            transform: scale(1.1);
        }
        .time-display {
            color: rgba(255,255,255,0.9);
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }
        
        /* Volume Slider */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            width: 32px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .volume-container:hover, .volume-container.active {
            width: 140px;
        }
        .volume-slider-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .volume-container:hover .volume-slider-wrapper, .volume-container.active .volume-slider-wrapper {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        .volume-slider {
            -webkit-appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 0;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 0;
            background: #ffffff;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
        .volume-percentage {
            color: white;
            font-size: 0.75rem;
            min-width: 32px;
            font-variant-numeric: tabular-nums;
        }

        /* Menu das resoluções */
        .quality-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .quality-menu {
            position: absolute;
            bottom: 36px;
            right: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent), #05050a;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 0;
            padding: 16px;
            display: none;
            flex-direction: column;
            width: 260px;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-family: sans-serif;
        }
        .quality-menu.show { display: flex; }
        
        .settings-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .settings-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .settings-radio {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            color: #fff;
        }
        .settings-radio input {
            accent-color: #05050a;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }


    </style>
</head>
<body>
    <!-- Initial Load Overlay -->
    <div id="play-overlay">
        <button id="play-btn-initial" class="play-redondo" aria-label="Reproduzir">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <div class="spinner" id="spinner"></div>
    </div>

    <!-- Custom Controls Overlay -->
    <div id="ui-layer" class="paused">
        <!-- Big Play Button -->
        <div class="big-play-btn" id="big-play-btn">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        
        <!-- Controls Bar -->
        <div class="video-controls" id="video-controls">
            <div class="progress-container" id="progress-container">
                <div class="progress-filled" id="progress-filled"></div>
            </div>
            
            <div class="controls-main">
                <div class="controls-left">
                    <button class="player-btn" id="play-pause-btn">
                        <!-- Default icon: Play -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    </button>
                    
                    <div class="volume-container" id="volume-container">
                        <button class="player-btn" id="volume-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                        <div class="volume-slider-wrapper">
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="3" step="0.05" value="1">
                            <div class="volume-percentage" id="volume-percentage">100%</div>
                        </div>
                    </div>
                    
                    <div class="time-display" id="time-display">0:00 / 0:00</div>
                </div>
                
                <div class="controls-right">
                    <div class="quality-container" id="quality-container">
                        <button class="player-btn" id="quality-btn" title="Resolução" data-i18n-title="video.resolucao">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        </button>
                        <div class="quality-menu" id="quality-menu"></div>
                    </div>
                    <button class="player-btn" id="vr-btn" title="Ver com óculos" data-i18n-title="video.oculos" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-2.5a2 2 0 0 1-1.7-1l-.9-1.4a1.2 1.2 0 0 0-2 0l-.9 1.4a2 2 0 0 1-1.7 1H6a3 3 0 0 1-3-3z"></path></svg>
                    </button>
                    <button class="player-btn" id="fullscreen-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 3H3v5m18 0V3h-5m0 18h5v-5M3 16v5h5"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- A-Frame 360 Engine -->
    <a-scene loading-screen="enabled: false" vr-mode-ui="enabled: false">
        <a-assets>
            <!-- Video dynamically injected -->
        </a-assets>
        <!-- look-controls: reverseMouseDrag allows natural drag-to-look -->
        <a-entity id="camera" camera look-controls="reverseMouseDrag: true"></a-entity>
    </a-scene>

    <script type="module">
        import { fontesDeVideo } from './videos.mjs?v=5';
        import { criarGestorDeQualidade, limiteDeTexturaDoAparelho } from './qualidade-video.mjs?v=8';

        const urlParams = new URLSearchParams(window.location.search);

        // A página recebe o nome da rota e trata das versões sozinha. O
        // endereço directo continua a funcionar, para links antigos.
        const nome = urlParams.get('nome') || 'Esvarena - 360 - A';
        const enderecoDirecto = urlParams.get('src');

        // Um vídeo normal (uma entrevista) entra aqui em modo de ecrã
        // plano, e pode vir com o momento em que ia a dar lá fora.
        const ecraPlano = urlParams.get('plano') === '1';
        const momentoInicial = parseFloat(urlParams.get('t') || '0') || 0;
        const fontes = enderecoDirecto ? { 'Original': enderecoDirecto } : fontesDeVideo(nome);

        // DOM Elements
        const overlay = document.getElementById('play-overlay');
        const playBtnInitial = document.getElementById('play-btn-initial');
        const spinner = document.getElementById('spinner');
        const uiLayer = document.getElementById('ui-layer');
        const videoControls = document.getElementById('video-controls');
        const bigPlayBtn = document.getElementById('big-play-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFilled = document.getElementById('progress-filled');
        const timeDisplay = document.getElementById('time-display');
        const volumeBtn = document.getElementById('volume-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const volumePercentage = document.getElementById('volume-percentage');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const qualityBtn = document.getElementById('quality-btn');
        const qualityMenu = document.getElementById('quality-menu');
        const vrBtn = document.getElementById('vr-btn');
        
        const scene = document.querySelector('a-scene');
        const assets = document.querySelector('a-assets');

        // Create Video Element
        const video = document.createElement('video');
        video.id = 'video360';
        video.crossOrigin = 'anonymous';
        video.playsInline = true;
        video.webkitPlaysinline = true;
        video.loop = true;
        video.preload = 'auto';
        assets.appendChild(video);

        // Duas maneiras de mostrar o vídeo: à volta do observador, que é o
        // caso das rotas, ou num ecrã grande à frente dele, que é como uma
        // entrevista se vê bem dentro dos óculos — como estar numa sala de
        // cinema vazia.
        if (ecraPlano) {
            const painel = document.createElement('a-video');
            painel.setAttribute('src', '#video360');
            painel.setAttribute('width', '6.4');
            painel.setAttribute('height', '3.6');
            painel.setAttribute('position', '0 1.6 -5');
            scene.appendChild(painel);

            // Um chão discreto dá referência ao corpo e evita a sensação de
            // se estar a flutuar no escuro.
            const chao = document.createElement('a-plane');
            chao.setAttribute('rotation', '-90 0 0');
            chao.setAttribute('width', '30');
            chao.setAttribute('height', '30');
            chao.setAttribute('color', '#0b0b12');
            chao.setAttribute('position', '0 0 0');
            scene.appendChild(chao);
        } else {
            const videosphere = document.createElement('a-videosphere');
            videosphere.setAttribute('src', '#video360');
            videosphere.setAttribute('rotation', '0 180 0'); // Seam placed directly behind the user
            videosphere.setAttribute('segments-width', '128');
            videosphere.setAttribute('segments-height', '64');
            videosphere.setAttribute('fix-seam', '');
            scene.appendChild(videosphere);
        }

        // --- Video Logic ---
        
        const formatTime = (seconds) => {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        };

        const playIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
        const pauseIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
        const volHighIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
        const volMutedIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';

        // Web Audio API for >100% Volume
        let audioCtx;
        let gainNode;
        let mediaSource;
        let isMuted = false;
        let currentVolume = 1;

        const initAudio = () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                mediaSource = audioCtx.createMediaElementSource(video);
                gainNode = audioCtx.createGain();
                mediaSource.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.value = currentVolume;
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };

        const togglePlay = () => {
            if (video.paused) {
                // Se entretanto a versão do vídeo trocar, este pedido é
                // cancelado pelo navegador — não é um erro que interesse.
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        };

        // Event Listeners
        // Quem chega aqui vindo do botão de óculos do mapa já pediu VR: o
        // botão do meio passa a ser o convite para entrar, porque abrir os
        // óculos exige sempre um toque dado nesta página.
        const pedidoDeVR = urlParams.get('vr') === '1';
        if (pedidoDeVR) {
            playBtnInitial.classList.remove('play-redondo');
            playBtnInitial.innerHTML =
                '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>' +
                (window.Idiomas ? window.Idiomas.t('video.oculos') : 'Ver com óculos');
        }

        playBtnInitial.addEventListener('click', () => {
            if (pedidoDeVR && scene.enterVR) {
                scene.enterVR().catch((erro) => console.log('VR:', erro));
            }
            playBtnInitial.style.display = 'none';
            spinner.style.display = 'block';
            
            video.play().then(() => {
                overlay.style.display = 'none';
                uiLayer.classList.remove('paused');
                initAudio();
                showControls();
            }).catch(e => {
                console.error(e);
                alert("Erro ao reproduzir vídeo. Tente novamente.");
                playBtnInitial.style.display = 'flex';
                spinner.style.display = 'none';
            });
        });

        // Nos vídeos das pessoas a imagem começa a andar mal a janela abre.
        // Aqui era preciso carregar num botão primeiro, e isso fazia as duas
        // janelas parecerem coisas diferentes. Agora tenta-se arrancar
        // sozinho; só se o navegador recusar (há navegadores que exigem um
        // toque antes de deixar sair som) é que o botão fica à espera.
        if (!pedidoDeVR) {
            video.addEventListener('canplay', () => {
                if (!video.paused) return;
                video.play().then(() => {
                    overlay.style.display = 'none';
                    uiLayer.classList.remove('paused');
                    showControls();
                }).catch(() => { /* fica o botão do meio à espera de um toque */ });
            }, { once: true });
        }

        // O comando do volume passa pela mesa de som do navegador, e essa
        // só pode ser ligada depois de a pessoa tocar em alguma coisa. Fica
        // à espera do primeiro toque, seja ele onde for.
        const ligarSomAoPrimeiroToque = () => initAudio();
        window.addEventListener('pointerdown', ligarSomAoPrimeiroToque, { once: true });
        window.addEventListener('keydown', ligarSomAoPrimeiroToque, { once: true });

        playPauseBtn.addEventListener('click', togglePlay);
        bigPlayBtn.addEventListener('click', togglePlay);
        
        video.addEventListener('play', () => {
            playPauseBtn.innerHTML = pauseIcon;
            uiLayer.classList.remove('paused');
            if(audioCtx) initAudio();
        });

        video.addEventListener('pause', () => {
            playPauseBtn.innerHTML = playIcon;
            uiLayer.classList.add('paused');
        });

        video.addEventListener('timeupdate', () => {
            const percent = (video.currentTime / video.duration) * 100;
            progressFilled.style.width = `${percent}%`;
            timeDisplay.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        video.addEventListener('loadedmetadata', () => {
            timeDisplay.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        });

        // Volume
        volumeSlider.addEventListener('input', (e) => {
            currentVolume = parseFloat(e.target.value);
            if (gainNode) gainNode.gain.value = currentVolume;
            else video.volume = Math.min(1, currentVolume);
            volumePercentage.innerText = Math.round(currentVolume * 100) + '%';
            
            if (currentVolume === 0) {
                volumeBtn.innerHTML = volMutedIcon;
                isMuted = true;
            } else {
                volumeBtn.innerHTML = volHighIcon;
                isMuted = false;
            }
        });

        volumeBtn.addEventListener('click', () => {
            if (isMuted) {
                currentVolume = parseFloat(volumeSlider.value) || 1;
                if (currentVolume === 0) { currentVolume = 1; volumeSlider.value = 1; }
                if (gainNode) gainNode.gain.value = currentVolume;
                else video.volume = Math.min(1, currentVolume);
                volumePercentage.innerText = Math.round(currentVolume * 100) + '%';
                volumeBtn.innerHTML = volHighIcon;
                isMuted = false;
            } else {
                if (gainNode) gainNode.gain.value = 0;
                else video.volume = 0;
                volumePercentage.innerText = '0%';
                volumeBtn.innerHTML = volMutedIcon;
                isMuted = true;
            }
        });

        fullscreenBtn.addEventListener('click', () => {
            const alvo = document.documentElement;
            const entrar = alvo.requestFullscreen || alvo.webkitRequestFullscreen;
            const sair = document.exitFullscreen || document.webkitExitFullscreen;
            try {
                if (!document.fullscreenElement) {
                    const pedido = entrar.call(alvo);
                    if (pedido && pedido.catch) pedido.catch(err => console.log(err));
                } else {
                    sair.call(document);
                }
            } catch (e) { console.log(e); }
        });

        document.addEventListener('fullscreenchange', () => {
            // A cena tem de se voltar a medir para encher o novo tamanho.
            window.dispatchEvent(new Event('resize'));
            if (scene && scene.resize) setTimeout(() => scene.resize(), 60);
            if (document.fullscreenElement) {
                fullscreenBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 9h6V3 M21 9h-6V3 M21 15h-6v6 M3 15h6v6"></path></svg>';
            } else {
                fullscreenBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 3H3v5m18 0V3h-5m0 18h5v-5M3 16v5h5"></path></svg>';
            }
        });

        // --- Menu das resoluções ---

        // Quem decide é o gestor: começa pelo que a ligação aguenta e vai
        // corrigindo sozinho. Aqui só se pergunta ainda à placa gráfica
        // que tamanho de imagem consegue mostrar, porque uma rota 360º é
        // aberta como uma imagem inteira à volta do observador.
        const gestor = criarGestorDeQualidade({
            video,
            fontes,
            nome,
            moldura: document.body,
            limiteDeTextura: limiteDeTexturaDoAparelho(),
            aoMudar: (resolucao, modo) => marcarEscolha(resolucao, modo)
        });

        let botaoAutomatico = null;
        let botoesResolucao = [];

        qualityMenu.innerHTML = `
            <div class="settings-title" data-i18n="video.qualidade">Qualidade</div>
            <div class="settings-options"></div>
        `;
        const optionsContainer = qualityMenu.querySelector('.settings-options');

        function marcarEscolha(resolucao, modo) {
            if (botaoAutomatico) {
                botaoAutomatico.nextSibling.innerText = modo === 'auto' ?
                    `Automático · ${resolucao}` : 'Automático';
                if (modo === 'auto') botaoAutomatico.checked = true;
            }
            if (botoesResolucao) {
                botoesResolucao.forEach((btn) => {
                    if (modo !== 'auto' && btn.dataset.resolucao === resolucao) {
                        btn.checked = true;
                    }
                });
            }
        }

        function criarOpcao(texto, aoClicar) {
            const label = document.createElement('label');
            label.className = 'settings-radio';
            
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = 'video-quality';
            
            const span = document.createElement('span');
            span.innerText = texto;
            
            label.appendChild(input);
            label.appendChild(span);
            
            input.addEventListener('change', () => {
                if (input.checked) {
                    aoClicar();
                    setTimeout(() => qualityMenu.classList.remove('show'), 150);
                }
            });
            
            optionsContainer.appendChild(label);
            return input;
        }

        botaoAutomatico = criarOpcao('Automático', () => gestor.automatico());
        botaoAutomatico.dataset.modo = 'auto';

        Object.keys(fontes).forEach((resolucao) => {
            const btn = criarOpcao(resolucao, () => gestor.fixar(resolucao));
            btn.dataset.resolucao = resolucao;
            botoesResolucao.push(btn);
        });

        gestor.arrancar();

        // Deixa o gestor à mão para diagnóstico a partir da consola.
        window.gestorDeQualidade = gestor;

        // Com uma só versão não há nada para escolher: o botão desaparece.
        if (Object.keys(fontes).length < 2) {
            document.getElementById('quality-container').style.display = 'none';
        }

        qualityBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            qualityMenu.classList.toggle('show');
        });

        window.addEventListener('click', (e) => {
            if (!e.target.closest('#quality-container')) {
                qualityMenu.classList.remove('show');
            }
        });

        // --- Óculos de realidade virtual ---

        // O botão só aparece a quem tenha óculos ligados.
        if (navigator.xr && navigator.xr.isSessionSupported) {
            navigator.xr.isSessionSupported('immersive-vr').then((tem) => {
                if (tem) vrBtn.style.display = '';
            }).catch(() => {});
        }

        vrBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (scene.is('vr-mode')) {
                scene.exitVR();
                return;
            }
            // Dentro dos óculos ninguém carrega no botão de arranque, por
            // isso o vídeo começa a andar aqui se ainda estiver parado.
            if (video.paused) {
                overlay.style.display = 'none';
                video.play().then(initAudio).catch(() => {});
            }
            scene.enterVR().catch((erro) => console.log('VR:', erro));
        });

        // Quando a entrevista vem do player do mapa, continua-se de onde ia.
        if (momentoInicial > 0) {
            video.addEventListener('loadedmetadata', () => {
                video.currentTime = momentoInicial;
            }, { once: true });
        }

        // Auto-hide controls logic
        let controlsTimeout;
        const showControls = () => {
            videoControls.classList.add('active');
            document.body.classList.remove('hide-cursor');
            clearTimeout(controlsTimeout);
            
            controlsTimeout = setTimeout(() => {
                if (!video.paused) {
                    videoControls.classList.remove('active');
                    document.body.classList.add('hide-cursor');
                }
            }, 5000);
        };

        // Listen for mouse movement anywhere to show controls
        window.addEventListener('mousemove', showControls);
        window.addEventListener('click', showControls);
        window.addEventListener('touchstart', showControls);
        
        // Click on 360 video canvas to toggle Play/Pause (avoid triggering on drag)
        let mousedownPos = {x:0, y:0};
        window.addEventListener('mousedown', (e) => {
            mousedownPos = {x: e.clientX, y: e.clientY};
        });
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                mousedownPos = {x: e.touches[0].clientX, y: e.touches[0].clientY};
            }
        });
        
        const handleInteractionEnd = (clientX, clientY, target) => {
            if (target.closest('.video-controls') || target.closest('#play-overlay') || target.closest('.big-play-btn')) return;
            
            const dx = clientX - mousedownPos.x;
            const dy = clientY - mousedownPos.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < 10 && target.tagName.toLowerCase() === 'canvas') {
                togglePlay();
            }
        };

        window.addEventListener('mouseup', (e) => {
            handleInteractionEnd(e.clientX, e.clientY, e.target);
        });
        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length > 0) {
                handleInteractionEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY, e.target);
            }
        });
        
        // Always show controls when paused
        video.addEventListener('pause', () => {
            clearTimeout(controlsTimeout);
            videoControls.classList.add('active');
            document.body.classList.remove('hide-cursor');
        });
        
    </script>
</body>
</html>
