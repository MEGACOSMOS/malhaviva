<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Video Player</title>
    <script src="/idiomas.js?v=19"></script>
    <script src="/quadrado-de-espera.js?v=4"></script>
    <!-- Os óculos de cartão do telemóvel, antes do A-Frame, para ele os
         encontrar (ver vr-cartao.js). -->
    <script src="/vr-cartao.js?v=2" data-modo="substituto"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- O dedo olha para todos os lados, e não só de lado a lado. -->
    <script src="/toque-360.js?v=1"></script>
    <script src="/comando-paginas.js?v=4" defer></script>
    <script>
        AFRAME.registerComponent('fix-seam', {
            init: function () {
                this.el.addEventListener('materialtextureloaded', () => {
                    const mesh = this.el.getObject3D('mesh');
                    if (mesh && mesh.material && mesh.material.map) {
                        mesh.material.map.wrapS = THREE.RepeatWrapping;
                        mesh.material.map.needsUpdate = true;
                    }
                });
            }
        });
    </script>
    <style>
        /* A letra do site: a Liberation Mono, servida daqui mesmo (ficheiros
           em /fonts, licença SIL Open Font). Dois pesos chegam: o normal
           até ao meio-negro, o negro daí para cima. */
        @font-face {
            font-family: 'Liberation Mono';
            src: url('/fonts/LiberationMono-Regular.ttf') format('truetype');
            font-weight: 100 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Liberation Mono';
            src: url('/fonts/LiberationMono-Bold.ttf') format('truetype');
            font-weight: 600 900;
            font-style: normal;
            font-display: swap;
        }

        html { margin: 0; padding: 0; width: 100%; height: 100%; }

        /* A imagem em cima e a barra dos comandos em baixo, uma por cima
           da outra: a barra deixa de tapar aquilo que se está a ver. */
        body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #05050a; overflow: hidden; font-family: 'Liberation Mono', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
        }

        /* Onde a rota vive. A cena enche isto por inteiro, e é aqui que
           assentam o botão de arranque e os sinais de salto. */
        #palco-360 {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
        }

        /* O rato só se some em cima da imagem; na barra é preciso vê-lo
           para se acertar num botão. */
        body.hide-cursor #palco-360, body.hide-cursor #palco-360 * {
            cursor: none !important;
        }

        /* ─── Play Initial Overlay ─── */
        #play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #play-btn-initial {
            background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.15); padding: 15px 40px; border-radius: 0;
            font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 10px;
            backdrop-filter: blur(8px);
        }
        #play-btn-initial:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }

        /* Quando é só para começar a ver, o botão é o mesmo círculo dos
           outros vídeos do bairro. A tarja larga com letras fica reservada
           para o convite a entrar nos óculos, que é outra coisa. */
        #play-btn-initial.play-redondo {
            background: rgba(0,0,0,0.6);
            border: none;
            border-radius: 50%;
            width: 70px; height: 70px;
            padding: 0;
            gap: 0;
            font-size: 0;
            box-shadow: none;
            backdrop-filter: none;
            justify-content: center;
        }
        #play-btn-initial.play-redondo:hover { background: rgba(0,0,0,0.75); transform: scale(1.1); }
        /* As esperas são o quadrado de espera do site, um pouco mais
           pequeno por estar em cima da imagem: o do arranque, no lugar do
           botão enquanto o vídeo não anda, e o que aparece a meio quando
           o vídeo fica à espera de mais imagem. Escondidos até serem
           precisos. */
        .quadrado-de-espera.espera-do-video {
            --lado: 8px;
            --folga: 3px;
            display: none;
        }
        #espera {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }
        #espera.a-esperar {
            display: grid;
        }

        /* ─── Custom UI Overlay ─── */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000; pointer-events: none;
        }
        
        /* --- Big Play Button --- */
        .big-play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            width: 70px; height: 70px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: white;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
        }
        #ui-layer.paused .big-play-btn {
            opacity: 1;
            pointer-events: auto;
        }
        /* Enquanto o filme ainda não arrancou, o que está no meio é o
           quadrado de espera: este botão, que é o da pausa, não aparece. */
        body.a-carregar #ui-layer.paused .big-play-btn {
            opacity: 0;
            pointer-events: none;
        }
        #ui-layer.paused .big-play-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            color: #ffffff;
        }

        /* --- A barra dos comandos ---
           Por baixo da imagem, e não por cima dela: nada do que se carrega
           tapa a rota, e a barra deixa de ter de se esconder sozinha.
           Traz o mesmo véu de luz da barra do nome da janela onde esta
           página é vista, virado ao contrário. */
        .video-controls {
            flex: 0 0 auto;
            background: linear-gradient(to top, rgba(255,255,255,0.05), transparent);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* Os botões surgem a esbater quando a página abre. É só o que
           está dentro da barra que se esbate: a barra em si, com a sua
           roupa, está lá desde o princípio — no mapa, uma de reserva
           igual a esta já lá estava por baixo —, e assim, se o navegador
           estiver ocupado a montar a cena e atrasar a animação, o que
           espera são os botões, e não uma barra escura. Em ecrã inteiro
           a barra tem o seu próprio deslize, e não isto. */
        @keyframes botoes-a-surgir {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .video-controls > * {
            animation: botoes-a-surgir 0.5s ease-out both;
            will-change: opacity;
        }
        body:fullscreen .video-controls > * {
            animation: none;
        }
        /* Em ecrã inteiro a barra passa a ficar por cima da imagem, e por
           isso fica recolhida: a rota vê-se toda, sem uma tarja preta a
           tapar-lhe o rodapé, mesmo enquanto se arrasta a vista para os
           lados. Só volta a espreitar quando o rato desce ao fundo da
           imagem, que é onde ela mora. */
        body:fullscreen .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(255,255,255,0.05), transparent), #05050a;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100%);
            z-index: 1000;
        }
        body:fullscreen.barra-a-espreitar .video-controls {
            transform: translateY(0);
        }
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            border-radius: 0;
            position: relative;
        }
        .progress-filled {
            height: 100%;
            background: #ffffff;
            width: 0%;
            border-radius: 0;
            pointer-events: none;
            transition: width 0.1s linear;
            position: relative;
        }
        /* Um quadrado pousado na ponta do que já se viu, para se saber de
           relance em que sítio do vídeo se vai. */
        .progress-filled::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translate(50%, -50%);
            width: 12px;
            height: 12px;
            background: #ffffff;
        }

        /* O tempo fica logo por cima da barra do tempo, encostado ao mesmo
           lado por onde ela começa. */
        .tempo-e-barra {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .controls-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        /* O sinal que pisca de cada lado ao saltar cinco segundos. */
        .salto-sinal {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .salto-sinal.esquerda { left: 12%; }
        .salto-sinal.direita { right: 12%; }
        .salto-sinal.a-piscar { animation: salto-a-piscar 0.6s ease-out; }
        @keyframes salto-a-piscar {
            0% { opacity: 0; transform: translateY(-50%) scale(0.8); }
            30% { opacity: 1; transform: translateY(-50%) scale(1); }
            100% { opacity: 0; transform: translateY(-50%) scale(1.05); }
        }

        /* ---- O aviso do vídeo 360º ---- */
        #ajuda-360 {
            position: fixed;
            inset: 0;
            /* Por cima da barra de controlos: enquanto o aviso está no ecrã
               é ele que manda, e a barra não fica meia acesa por trás. */
            z-index: 1100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(5, 5, 10, 0.72);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        #ajuda-360.visivel {
            display: flex;
            opacity: 1;
        }
        .ajuda-caixa {
            max-width: 420px;
            width: 100%;
            background: #05050a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 22px 24px;
        }
        .ajuda-titulo {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 14px;
        }
        .ajuda-lista {
            list-style: none;
            margin: 0 0 18px;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .ajuda-lista li {
            font-size: 0.88rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.75);
            padding-left: 16px;
            position: relative;
        }
        .ajuda-lista li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.55em;
            width: 6px;
            height: 1px;
            background: rgba(255, 255, 255, 0.45);
        }
        #ajuda-fechar {
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 9px 20px;
            background: #ffffff;
            color: #05050a;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }
        #ajuda-fechar:hover {
            opacity: 0.85;
        }

        .player-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: background 0.15s ease, transform 0.2s ease;
            padding: 8px;
            border-radius: 0;
        }
        .player-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            transform: scale(1.05);
        }
        .time-display {
            color: rgba(255,255,255,0.9);
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* A janela das coordenadas do olhar: só para quem tem o menu de
           desenvolvedor ligado no mapa. Diz para onde a câmara aponta —
           a volta (yaw), a inclinação (pitch) e a abertura — e a que
           segundo o filme vai. */
        #coordenadas {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 60;
            display: none;
            padding: 10px 12px;
            background: rgba(5, 5, 10, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.75rem;
            line-height: 1.5;
            font-variant-numeric: tabular-nums;
            white-space: pre;
            pointer-events: none;
        }
        #coordenadas.visivel {
            display: block;
        }
        
        /* Volume Slider */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volume-slider-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volume-slider {
            -webkit-appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 0;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 0;
            background: #ffffff;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
        .volume-percentage {
            color: white;
            font-size: 0.75rem;
            min-width: 32px;
            font-variant-numeric: tabular-nums;
        }

        /* Menu das resoluções */
        .quality-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .quality-menu {
            position: absolute;
            bottom: 36px;
            right: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent), #05050a;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 0;
            padding: 16px;
            display: none;
            flex-direction: column;
            width: 260px;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-family: 'Liberation Mono', 'Courier New', monospace;
        }
        .quality-menu.show { display: flex; }
        
        .settings-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .settings-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .settings-radio {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            color: #fff;
        }
        .settings-radio input {
            accent-color: #05050a;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }


        @media (max-width: 900px) {
            .video-controls {
                padding: 12px 12px 14px;
            }
            .controls-left, .controls-right {
                gap: 8px;
            }
            .player-btn svg {
                width: 18px;
                height: 18px;
            }
            .time-display {
                font-size: 0.75rem;
            }
            .volume-container {
                display: none; /* Em mobile, o controlo é feito com os botões físicos */
            }
            .quality-menu {
                right: -10px;
                bottom: 45px;
            }
        }

        /* ─── Contornos ───
           Um fio de um ponto a toda a volta, de um só tom — o mais escuro do
           degradé que aqui houve — pousado sobre o fundo escuro do site. */
        .quality-menu {
            border-color: transparent !important;
        }
        .quality-menu::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.3)), #05050a;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body class="a-carregar">
    <!-- A imagem em cima, os comandos em baixo. A cena é "embedded"
         para caber neste sítio em vez de tomar a página toda. -->
    <div id="palco-360">
        <!-- A-Frame 360 Engine -->
        <a-scene embedded loading-screen="enabled: false" vr-mode-ui="enabled: false">
            <a-assets>
                <!-- Video dynamically injected -->
            </a-assets>
            <!-- reverseMouseDrag: arrastar puxa a vista, como é natural.
                 magicWindowTrackingEnabled: desligado. Sem isto, num telemóvel a
                 imagem andava atrás de cada abano do aparelho mesmo com o vídeo
                 a ser visto no ecrã, e não havia maneira de o pousar em cima da
                 mesa. O sensor de movimento passa a mandar só dentro dos
                 óculos, que é onde faz falta. -->
            <a-entity id="camera" camera="fov: 80"
                      look-controls="reverseMouseDrag: true; magicWindowTrackingEnabled: false"></a-entity>
        </a-scene>

        <!-- Initial Load Overlay -->
        <div id="play-overlay">
            <button id="play-btn-initial" class="play-redondo" aria-label="Reproduzir">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>
            <div class="espera-do-video" id="spinner"></div>
        </div>

        <!-- As coordenadas do olhar, para quem afina as paragens. -->
        <div id="coordenadas" aria-hidden="true"></div>

        <!-- Custom Controls Overlay -->
        <div id="ui-layer" class="paused">
            <!-- O quadrado de espera de quando falta imagem -->
            <div class="espera-do-video" id="espera"></div>

            <div id="sinal-esquerda" class="salto-sinal esquerda">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polyline points="11 18 5 12 11 6"></polyline><polyline points="19 18 13 12 19 6"></polyline></svg>
                <span>5 s</span>
            </div>
            <div id="sinal-direita" class="salto-sinal direita">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polyline points="5 18 11 12 5 6"></polyline><polyline points="13 18 19 12 13 6"></polyline></svg>
                <span>5 s</span>
            </div>

            <div class="big-play-btn" id="big-play-btn">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
        </div>
    </div>

    <!-- Controls Bar -->
    <div class="video-controls" id="video-controls">
        <div class="tempo-e-barra">
            <div class="time-display" id="time-display">0:00 / 0:00</div>
            <div class="progress-container" id="progress-container">
                <div class="progress-filled" id="progress-filled"></div>
            </div>
        </div>
        
        <div class="controls-main">
            <div class="controls-left">
                <button class="player-btn" id="recuar-btn" data-i18n-title="v360.recuar" title="Recuar 5 segundos">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                        <polyline points="11 18 5 12 11 6"></polyline>
                        <polyline points="19 18 13 12 19 6"></polyline>
                    </svg>
                </button>
                <button class="player-btn" id="play-pause-btn" data-i18n-title="v360.tocar" title="Tocar / Pausar">
                    <!-- Default icon: Play -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
                <button class="player-btn" id="avancar-btn" data-i18n-title="v360.avancar" title="Avançar 5 segundos">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                        <polyline points="5 18 11 12 5 6"></polyline>
                        <polyline points="13 18 19 12 13 6"></polyline>
                    </svg>
                </button>
                
                <div class="volume-container" id="volume-container">
                    <button class="player-btn" id="volume-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </button>
                    <div class="volume-slider-wrapper">
                        <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1">
                        <div class="volume-percentage" id="volume-percentage">100%</div>
                    </div>
                </div>
            </div>
            
            <div class="controls-right">
                <div class="quality-container" id="quality-container">
                    <button class="player-btn" id="quality-btn" title="Resolução" data-i18n-title="video.resolucao">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><circle cx="12" cy="12" r="3"></circle><path d="M10.08 4.85L10.07 1.58L13.93 1.58L13.92 4.85A7.4 7.4 0 0 1 17.23 6.77L20.06 5.12L21.99 8.46L19.15 10.08A7.4 7.4 0 0 1 19.15 13.92L21.99 15.54L20.06 18.88L17.23 17.23A7.4 7.4 0 0 1 13.92 19.15L13.93 22.42L10.07 22.42L10.08 19.15A7.4 7.4 0 0 1 6.77 17.23L3.94 18.88L2.01 15.54L4.85 13.92A7.4 7.4 0 0 1 4.85 10.08L2.01 8.46L3.94 5.12L6.77 6.77A7.4 7.4 0 0 1 10.08 4.85Z"></path></svg>
                    </button>
                    <div class="quality-menu" id="quality-menu"></div>
                </div>
                <button class="player-btn" id="recentrar-btn" data-i18n-title="v360.recentrar" title="Endireitar a vista">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                        <line x1="12" y1="2" x2="12" y2="22"></line>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <polyline points="3 8 3 3 8 3"></polyline>
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <polyline points="3 16 3 21 8 21"></polyline>
                        <polyline points="16 21 21 21 21 16"></polyline>
                    </svg>
                </button>
                <button class="player-btn" id="vr-btn" title="Ver com óculos" data-i18n-title="video.oculos" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M2 5h20v14h-6l-2-4h-4l-2 4H2z"></path><rect x="5" y="9" width="4" height="4"></rect><rect x="15" y="9" width="4" height="4"></rect></svg>
                </button>
                <button class="player-btn" id="fullscreen-btn" data-i18n-title="v360.ecra" title="Ecrã inteiro">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 3H3v5m18 0V3h-5m0 18h5v-5M3 16v5h5"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- O aviso que explica, na primeira vez que o vídeo arranca, que
         isto não é um vídeo normal: dá a volta toda a quem o vê. -->
    <div id="ajuda-360">
        <div class="ajuda-caixa">
            <div class="ajuda-titulo" data-i18n="v360.ajudaTitulo">Isto é um vídeo 360º</div>
            <ul class="ajuda-lista">
                <li id="ajuda-olhar" data-i18n="v360.ajudaOlhar">Arraste com o rato para olhar em volta — a imagem dá a volta toda.</li>
                <li id="ajuda-pausa" data-i18n="v360.ajudaPausa">Clique na imagem para pausar, ou use a barra em baixo.</li>
                <li id="ajuda-oculos" data-i18n="v360.ajudaOculos" style="display: none;">Com óculos ligados, o botão dos óculos põe-no lá dentro.</li>
            </ul>
            <button type="button" id="ajuda-fechar" data-i18n="v360.ajudaEntendi">Entendi</button>
        </div>
    </div>

    <script type="module">
        import { fontesDeVideo, previaDe, olharInicialDe, ABERTURA_INICIAL } from './videos.mjs?v=7';
        import { criarGestorDeQualidade, limiteDeTexturaDoAparelho } from './qualidade-video.mjs?v=9';

        const urlParams = new URLSearchParams(window.location.search);

        // A página recebe o nome da rota e trata das versões sozinha. O
        // endereço directo continua a funcionar, para links antigos.
        const nome = urlParams.get('nome') || 'Esvarena - 360 - A';
        const enderecoDirecto = urlParams.get('src');

        // Um vídeo normal (uma entrevista) entra aqui em modo de ecrã
        // plano, e pode vir com o momento em que ia a dar lá fora.
        const ecraPlano = urlParams.get('plano') === '1';
        const momentoInicial = parseFloat(urlParams.get('t') || '0') || 0;
        const fontes = enderecoDirecto ? { 'Original': enderecoDirecto } : fontesDeVideo(nome);

        // DOM Elements
        const overlay = document.getElementById('play-overlay');
        const playBtnInitial = document.getElementById('play-btn-initial');
        const spinner = document.getElementById('spinner');

        // As duas esperas vestem o quadrado de espera do site.
        if (window.QuadradoDeEspera) {
            window.QuadradoDeEspera.fazer(spinner);
            window.QuadradoDeEspera.fazer(document.getElementById('espera'));
        }
        const uiLayer = document.getElementById('ui-layer');
        const bigPlayBtn = document.getElementById('big-play-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFilled = document.getElementById('progress-filled');
        const timeDisplay = document.getElementById('time-display');
        const volumeBtn = document.getElementById('volume-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const volumePercentage = document.getElementById('volume-percentage');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const qualityBtn = document.getElementById('quality-btn');
        const qualityMenu = document.getElementById('quality-menu');
        const vrBtn = document.getElementById('vr-btn');
        
        const scene = document.querySelector('a-scene');
        const assets = document.querySelector('a-assets');

        // Create Video Element
        const video = document.createElement('video');
        video.id = 'video360';
        video.crossOrigin = 'anonymous';
        video.playsInline = true;
        video.webkitPlaysinline = true;
        video.loop = true;
        video.preload = 'auto';
        assets.appendChild(video);

        // Duas maneiras de mostrar o vídeo: à volta do observador, que é o
        // caso das rotas, ou num ecrã grande à frente dele, que é como uma
        // entrevista se vê bem dentro dos óculos — como estar numa sala de
        // cinema vazia.
        // A esfera (ou o ecrã) só mostra o filme depois de o A-Frame lhe
        // ter feito a textura e de a cena estar a ser desenhada. Antes
        // disso o filme pode andar — e o som com ele — sem se ver nada:
        // é preciso saber quando é que se vê.
        let texturaDoFilmePronta = false;
        let cenaADesenhar = !!scene.renderStarted;
        scene.addEventListener('renderstart', () => { cenaADesenhar = true; });
        const vigiarATextura = (el) => {
            el.addEventListener('materialtextureloaded', () => { texturaDoFilmePronta = true; });
        };

        if (ecraPlano) {
            const painel = document.createElement('a-video');
            vigiarATextura(painel);
            painel.setAttribute('src', '#video360');
            painel.setAttribute('width', '6.4');
            painel.setAttribute('height', '3.6');
            painel.setAttribute('position', '0 1.6 -5');
            scene.appendChild(painel);

            // Um chão discreto dá referência ao corpo e evita a sensação de
            // se estar a flutuar no escuro.
            const chao = document.createElement('a-plane');
            chao.setAttribute('rotation', '-90 0 0');
            chao.setAttribute('width', '30');
            chao.setAttribute('height', '30');
            chao.setAttribute('color', '#0b0b12');
            chao.setAttribute('position', '0 0 0');
            scene.appendChild(chao);
        } else {
            const videosphere = document.createElement('a-videosphere');
            vigiarATextura(videosphere);
            videosphere.setAttribute('src', '#video360');
            videosphere.setAttribute('rotation', '0 180 0'); // Seam placed directly behind the user
            videosphere.setAttribute('segments-width', '128');
            videosphere.setAttribute('segments-height', '64');
            videosphere.setAttribute('fix-seam', '');
            scene.appendChild(videosphere);
        }

        // A imagem do primeiro instante da rota, numa esfera mais pequena
        // por dentro da do vídeo, com a mesma volta dada: é o que se vê
        // desde que a janela abre até o filme andar, em vez de preto. É
        // a mesma imagem que a janela do lado mostrava, vista pela mesma
        // câmara, por isso a passagem de uma para a outra não salta. Quando
        // o filme anda de verdade, esta esfera esbate-se e sai.
        let esferaDaPrevia = null;
        // O mapa, que tem esta página numa janela, tapa-a com a mesma
        // imagem enquanto ela não chega; avisa-se quando ela está posta.
        const avisarQueAPreviaEstaPosta = () => {
            if (window.parent === window) return;
            // Só depois de a cena estar a ser desenhada, e de duas
            // imagens dela: antes disso a textura existe mas ninguém a
            // pôs no ecrã, e o mapa destapava a janela para se ver preto.
            const avisar = () => {
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    window.parent.postMessage({ malhaViva: 'previa360pronta', nome }, window.location.origin);
                }));
            };
            if (scene.renderStarted) avisar();
            else scene.addEventListener('renderstart', avisar, { once: true });
        };
        if (!ecraPlano && !enderecoDirecto) {
            esferaDaPrevia = document.createElement('a-sky');
            esferaDaPrevia.setAttribute('src', previaDe(nome));
            esferaDaPrevia.setAttribute('radius', '400');
            esferaDaPrevia.setAttribute('rotation', '0 180 0');
            esferaDaPrevia.setAttribute('segments-width', '128');
            esferaDaPrevia.setAttribute('segments-height', '64');
            esferaDaPrevia.setAttribute('material', 'shader: flat; side: back; npot: true');
            esferaDaPrevia.addEventListener('materialtextureloaded', avisarQueAPreviaEstaPosta, { once: true });
            scene.appendChild(esferaDaPrevia);
        } else {
            avisarQueAPreviaEstaPosta();
        }
        const despedirAPrevia = () => {
            const esfera = esferaDaPrevia;
            if (!esfera) return;
            esferaDaPrevia = null;
            // Sai de vez, sem esbater: o filme começa no mesmo instante
            // que a imagem mostrava, e um esbatimento só o baralhava.
            if (esfera.parentNode) esfera.parentNode.removeChild(esfera);
        };

        // --- Video Logic ---
        
        const formatTime = (seconds) => {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        };

        const playIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
        const pauseIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
        const volHighIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
        const volMutedIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';

        // O som é o do próprio vídeo, sem mesa de som pelo meio. Houve uma
        // — a do navegador, para passar dos cem por cento — e era por ela
        // que o som se perdia: só pode ser ligada por um toque a sério, e
        // ligada por um toque de dedo ou por uma tecla mandada de fora
        // ficava muda, com o vídeo a andar em silêncio.
        let isMuted = false;
        let currentVolume = 1;

        // Põe o som do vídeo como a barra o pede. Calar é pôr o volume no
        // zero, e não tapar o vídeo: um vídeo tapado nem sempre se deixa
        // destapar sem um toque, e este destapa-se de qualquer lado.
        const porOSom = () => {
            video.volume = isMuted ? 0 : Math.min(1, currentVolume);
        };

        const togglePlay = () => {
            if (video.paused) {
                // Se entretanto a versão do vídeo trocar, este pedido é
                // cancelado pelo navegador — não é um erro que interesse.
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        };

        // Event Listeners
        // Quem chega aqui vindo do botão de óculos do mapa já pediu VR: o
        // botão do meio passa a ser o convite para entrar, porque abrir os
        // óculos exige sempre um toque dado nesta página.
        const pedidoDeVR = urlParams.get('vr') === '1';
        if (pedidoDeVR) {
            playBtnInitial.classList.remove('play-redondo');
            playBtnInitial.innerHTML =
                '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>' +
                (window.Idiomas ? window.Idiomas.t('video.oculos') : 'Ver com óculos');
        } else {
            // Enquanto o filme carrega está o quadrado de espera no meio,
            // e não o botão: o botão só aparece se o navegador recusar o
            // arranque automático, que é quando faz falta um toque.
            playBtnInitial.style.display = 'none';
            spinner.style.display = 'grid';
        }

        // ---- O arranque ----
        //
        // O quadrado de espera está no meio desde o princípio, e a cortina
        // abre-se quando o vídeo anda de verdade — venha o arranque de
        // onde vier: de si mesmo, do botão, ou de uma troca de versão a
        // meio. Como a textura demora um pouco a ser puxada para a placa
        // gráfica, o som começava antes da imagem (ecrã preto): por isso
        // todos os arranques se fazem com o volume no zero, e o som só
        // entra quando já há imagem para o acompanhar. É aqui, e só aqui,
        // que o volume é devolvido — e assim nunca fica preso no zero,
        // que era como o vídeo andava em silêncio.
        let cortinaAberta = false;
        let aEsperarPelaImagem = false;

        const abrirCortina = () => {
            if (cortinaAberta) return;
            cortinaAberta = true;
            porOSom();
            document.body.classList.remove('a-carregar');
            overlay.style.display = 'none';
            uiLayer.classList.remove('paused');
            despedirAPrevia();
            showControls();
            // O mapa, que tapa esta janela com a imagem parada enquanto
            // ela chega, fica a saber que o filme já anda.
            if (window.parent !== window) {
                window.parent.postMessage({ malhaViva: 'filme360aAndar', nome }, window.location.origin);
            }
        };

        // Quantas imagens do filme o navegador já descodificou. É o sinal
        // seguro de que há imagem: o relógio do vídeo anda com o som, e
        // nas rotas em 8K o som chegava a andar um bom bocado antes de a
        // primeira imagem estar descodificada e posta na placa gráfica.
        const imagensDescodificadas = () => {
            if (typeof video.getVideoPlaybackQuality === 'function') {
                return video.getVideoPlaybackQuality().totalVideoFrames;
            }
            if (typeof video.webkitDecodedFrameCount === 'number') {
                return video.webkitDecodedFrameCount;
            }
            return -1;
        };

        // Espera que haja mesmo imagem — duas imagens descodificadas e o
        // filme a andar — e dá ainda duas imagens ao A-Frame para a pôr
        // na esfera. Se a janela estiver escondida essas imagens não vêm,
        // e vale então um instante de relógio no lugar delas. Onde o
        // navegador não diz quantas imagens descodificou, fica o relógio
        // do vídeo a servir de sinal, como dantes.
        const esperarPelaImagem = (depois) => {
            if (aEsperarPelaImagem) return;
            aEsperarPelaImagem = true;
            let feito = false;
            let relogio = null;
            const pronto = () => {
                if (feito) return;
                feito = true;
                aEsperarPelaImagem = false;
                clearInterval(relogio);
                depois();
            };
            const desenhada = () => {
                if (document.hidden) {
                    setTimeout(pronto, 150);
                } else {
                    requestAnimationFrame(() => requestAnimationFrame(pronto));
                    setTimeout(pronto, 400);
                }
            };
            const comecou = performance.now();
            const haImagem = () => {
                if (feito) return true;
                if (video.paused || video.currentTime <= 0.05) return false;
                // Passado muito tempo com o filme a andar e sem sinal de
                // imagem, vale o relógio do vídeo, para não ficar preso.
                if (performance.now() - comecou > 10000) return true;
                if (!texturaDoFilmePronta || !cenaADesenhar) return false;
                const imagens = imagensDescodificadas();
                return imagens < 0 || imagens >= 2;
            };
            const ver = () => {
                if (feito) return;
                if (haImagem()) {
                    clearInterval(relogio);
                    desenhada();
                }
            };
            relogio = setInterval(ver, 50);
            video.addEventListener('timeupdate', ver);
            ver();
        };

        video.addEventListener('playing', () => {
            if (!cortinaAberta) esperarPelaImagem(abrirCortina);
        });

        // Arrancar com o volume no zero; o som entra com a imagem.
        const arrancarCalado = () => {
            video.volume = 0;
            return video.play();
        };

        // O filme só arranca com imagem suficiente descarregada para
        // andar sem parar (HAVE_ENOUGH_DATA): arrancar antes disso era o
        // som a começar com a imagem ainda preta. Quem carrega no botão
        // antes de o vídeo estar pronto fica com o quadrado de espera, e
        // o arranque faz-se sozinho mal esteja.
        // E só arranca com a cena já a ser desenhada: arrancar antes era
        // o filme a andar às escuras, e a imagem a chegar já uns segundos
        // adiantada em relação ao princípio.
        const PRONTO = 4;
        const quandoPronto = (depois) => {
            let feito = false;
            const ver = () => {
                if (feito || video.readyState < PRONTO || !cenaADesenhar) return;
                feito = true;
                video.removeEventListener('canplaythrough', ver);
                scene.removeEventListener('renderstart', ver);
                depois();
            };
            video.addEventListener('canplaythrough', ver);
            scene.addEventListener('renderstart', ver);
            ver();
        };

        playBtnInitial.addEventListener('click', () => {
            if (pedidoDeVR && scene.enterVR) {
                scene.enterVR().catch((erro) => console.log('VR:', erro));
            }
            playBtnInitial.style.display = 'none';
            spinner.style.display = 'grid';

            quandoPronto(() => arrancarCalado().catch(e => {
                // Uma troca de versão a meio do arranque interrompe o
                // pedido, mas o vídeo volta a arrancar sozinho a seguir e
                // a cortina abre-se na mesma: não é um erro.
                if (e && e.name === 'AbortError') return;
                console.error(e);
                porOSom();
                alert("Erro ao reproduzir vídeo. Tente novamente.");
                playBtnInitial.style.display = 'flex';
                spinner.style.display = 'none';
            }));
        });

        // A rota começa a andar mal esteja pronta, sem ninguém ter de
        // carregar em nada — quando o navegador deixa. Só se tenta com o
        // som ligado: um vídeo que arranca tapado nem sempre se deixa
        // destapar depois, e ficava-se a ver a rota em silêncio. Quando o
        // navegador não deixa, fica o botão do meio à espera do toque que
        // ele exige — e esse toque traz o som consigo.
        if (!pedidoDeVR) {
            quandoPronto(() => {
                if (!video.paused || cortinaAberta) return;
                arrancarCalado().catch((erro) => {
                    // Uma troca de versão a meio do arranque também
                    // interrompe o pedido; nesse caso o vídeo volta a
                    // arrancar sozinho e a cortina abre-se na mesma.
                    if (erro && erro.name === 'AbortError') return;
                    // O navegador não deixou: fica o botão à espera do
                    // toque, no lugar do quadrado de espera — e o mapa,
                    // que tapa esta janela enquanto o filme não anda, tem
                    // de a destapar para o botão se ver.
                    porOSom();
                    if (cortinaAberta) return;
                    spinner.style.display = 'none';
                    playBtnInitial.style.display = 'flex';
                    if (window.parent !== window) {
                        window.parent.postMessage({ malhaViva: 'botao360aEspera', nome }, window.location.origin);
                    }
                });
            });
        }

        playPauseBtn.addEventListener('click', togglePlay);
        bigPlayBtn.addEventListener('click', togglePlay);

        video.addEventListener('play', () => {
            playPauseBtn.innerHTML = pauseIcon;
            uiLayer.classList.remove('paused');
        });

        video.addEventListener('pause', () => {
            playPauseBtn.innerHTML = playIcon;
            uiLayer.classList.add('paused');
        });

        video.addEventListener('timeupdate', () => {
            const percent = (video.currentTime / video.duration) * 100;
            progressFilled.style.width = `${percent}%`;
            timeDisplay.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        video.addEventListener('loadedmetadata', () => {
            timeDisplay.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        });

        // Volume
        volumeSlider.addEventListener('input', (e) => {
            currentVolume = parseFloat(e.target.value);
            isMuted = currentVolume === 0;
            porOSom();
            volumePercentage.innerText = Math.round(currentVolume * 100) + '%';
            volumeBtn.innerHTML = isMuted ? volMutedIcon : volHighIcon;
        });

        volumeBtn.addEventListener('click', () => {
            if (isMuted) {
                currentVolume = parseFloat(volumeSlider.value) || 1;
                if (currentVolume === 0) { currentVolume = 1; volumeSlider.value = 1; }
                isMuted = false;
                volumePercentage.innerText = Math.round(currentVolume * 100) + '%';
                volumeBtn.innerHTML = volHighIcon;
            } else {
                isMuted = true;
                volumePercentage.innerText = '0%';
                volumeBtn.innerHTML = volMutedIcon;
            }
            porOSom();
        });

        fullscreenBtn.addEventListener('click', () => {
            const alvo = document.documentElement;
            const entrar = alvo.requestFullscreen || alvo.webkitRequestFullscreen;
            const sair = document.exitFullscreen || document.webkitExitFullscreen;
            try {
                if (!document.fullscreenElement) {
                    const pedido = entrar.call(alvo);
                    if (pedido && pedido.catch) pedido.catch(err => console.log(err));
                } else {
                    sair.call(document);
                }
            } catch (e) { console.log(e); }
        });

        document.addEventListener('fullscreenchange', () => {
            // A cena tem de se voltar a medir para encher o novo tamanho.
            window.dispatchEvent(new Event('resize'));
            if (scene && scene.resize) setTimeout(() => scene.resize(), 60);
            if (document.fullscreenElement) {
                fullscreenBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 9h6V3 M21 9h-6V3 M21 15h-6v6 M3 15h6v6"></path></svg>';
            } else {
                fullscreenBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 3H3v5m18 0V3h-5m0 18h5v-5M3 16v5h5"></path></svg>';
            }
        });

        // --- Menu das resoluções ---

        // Quem decide é o gestor: começa pelo que a ligação aguenta e vai
        // corrigindo sozinho. Aqui só se pergunta ainda à placa gráfica
        // que tamanho de imagem consegue mostrar, porque uma rota 360º é
        // aberta como uma imagem inteira à volta do observador.
        const gestor = criarGestorDeQualidade({
            video,
            fontes,
            nome,
            moldura: document.body,
            limiteDeTextura: limiteDeTexturaDoAparelho(),
            aoMudar: (resolucao, modo) => marcarEscolha(resolucao, modo)
        });

        let botaoAutomatico = null;
        let botoesResolucao = [];

        qualityMenu.innerHTML = `
            <div class="settings-title" data-i18n="video.qualidade">Qualidade</div>
            <div class="settings-options"></div>
        `;
        const optionsContainer = qualityMenu.querySelector('.settings-options');

        function marcarEscolha(resolucao, modo) {
            if (botaoAutomatico) {
                botaoAutomatico.nextSibling.innerText = modo === 'auto' ?
                    `Automático · ${resolucao}` : 'Automático';
                if (modo === 'auto') botaoAutomatico.checked = true;
            }
            if (botoesResolucao) {
                botoesResolucao.forEach((btn) => {
                    if (modo !== 'auto' && btn.dataset.resolucao === resolucao) {
                        btn.checked = true;
                    }
                });
            }
        }

        function criarOpcao(texto, aoClicar) {
            const label = document.createElement('label');
            label.className = 'settings-radio';
            
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = 'video-quality';
            
            const span = document.createElement('span');
            span.innerText = texto;
            
            label.appendChild(input);
            label.appendChild(span);
            
            input.addEventListener('change', () => {
                if (input.checked) {
                    aoClicar();
                    setTimeout(() => qualityMenu.classList.remove('show'), 150);
                }
            });
            
            optionsContainer.appendChild(label);
            return input;
        }

        botaoAutomatico = criarOpcao('Automático', () => gestor.automatico());
        botaoAutomatico.dataset.modo = 'auto';

        Object.keys(fontes).forEach((resolucao) => {
            const btn = criarOpcao(resolucao, () => gestor.fixar(resolucao));
            btn.dataset.resolucao = resolucao;
            botoesResolucao.push(btn);
        });

        gestor.arrancar();

        // Deixa o gestor à mão para diagnóstico a partir da consola.
        window.gestorDeQualidade = gestor;

        // Com uma só versão não há nada para escolher: o botão desaparece.
        if (Object.keys(fontes).length < 2) {
            document.getElementById('quality-container').style.display = 'none';
        }

        qualityBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            qualityMenu.classList.toggle('show');
        });

        window.addEventListener('click', (e) => {
            if (!e.target.closest('#quality-container')) {
                qualityMenu.classList.remove('show');
            }
        });

        // --- Óculos de realidade virtual ---

        // O botão só aparece a quem tenha óculos — a sério, ou de cartão no
        // telemóvel (ver vr-cartao.js), que chegam um pouco depois.
        const haOculos = window.VRCartao && window.VRCartao.pronto
            ? window.VRCartao.pronto
            : (navigator.xr && navigator.xr.isSessionSupported
                ? navigator.xr.isSessionSupported('immersive-vr').catch(() => false)
                : Promise.resolve(false));
        haOculos.then((tem) => { if (tem) vrBtn.style.display = ''; });

        vrBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (scene.is('vr-mode')) {
                scene.exitVR();
                return;
            }
            // No iPhone o sensor de movimento pede licença a partir de um
            // toque: este.
            if (window.VRCartao) await window.VRCartao.pedirSensores();
            // Dentro dos óculos ninguém carrega no botão de arranque, por
            // isso o vídeo começa a andar aqui se ainda estiver parado.
            if (video.paused) {
                overlay.style.display = 'none';
                arrancarCalado().catch(() => porOSom());
            }
            scene.enterVR().catch((erro) => console.log('VR:', erro));
        });

        // Quando a entrevista vem do player do mapa, continua-se de onde ia.
        if (momentoInicial > 0) {
            video.addEventListener('loadedmetadata', () => {
                video.currentTime = momentoInicial;
            }, { once: true });
        }

        // Fora do ecrã inteiro a barra está por baixo da imagem e não tapa
        // nada: fica sempre à vista. O que se some é o rato, parado em
        // cima da rota.
        let ratoParado;
        const showControls = () => {
            document.body.classList.remove('hide-cursor');
            clearTimeout(ratoParado);

            ratoParado = setTimeout(() => {
                const overControls = document.getElementById('video-controls').matches(':hover');
                if (!video.paused && (!overControls || !document.fullscreenElement)) {
                    document.body.classList.add('hide-cursor');
                }
            }, 5000);
        };

        // ---- A barra em ecrã inteiro ----
        //
        // Em ecrã inteiro a barra tapa o fundo da rota, e por isso está
        // recolhida enquanto se olha à volta — mexer a vista já não a faz
        // aparecer. Espreita quando o rato desce à faixa de baixo da
        // imagem, e quando se anda de tecla pelos botões, para quem não
        // usa rato lá chegar na mesma.
        const barraControlos = document.getElementById('video-controls');
        let ratoNoFundo = false;
        let tecladoNaBarra = false;

        // A faixa que faz a barra espreitar: um pouco mais alta do que a
        // própria barra, para não ser preciso acertar em cheio.
        const faixaDoFundo = () => {
            const altura = barraControlos.offsetHeight || 90;
            return Math.max(80, Math.min(altura + 40, window.innerHeight * 0.25));
        };

        const arrumarBarra = () => {
            const espreita = !document.fullscreenElement ||
                ratoNoFundo || tecladoNaBarra;
            document.body.classList.toggle('barra-a-espreitar', espreita);
        };

        const olharOndeEstaORato = (y) => {
            ratoNoFundo = (window.innerHeight - y) <= faixaDoFundo();
            arrumarBarra();
        };

        window.addEventListener('mousemove', (e) => {
            showControls();
            olharOndeEstaORato(e.clientY);
        });
        window.addEventListener('click', (e) => {
            showControls();
            if (typeof e.clientY === 'number') olharOndeEstaORato(e.clientY);
        });
        window.addEventListener('touchstart', (e) => {
            showControls();
            if (e.touches && e.touches.length > 0) olharOndeEstaORato(e.touches[0].clientY);
        }, { passive: true });

        // Só quando o foco chega pelo teclado. Um botão carregado com o
        // rato também fica com o foco, e a barra ficaria aberta para
        // sempre depois de se carregar em qualquer coisa.
        barraControlos.addEventListener('focusin', () => {
            tecladoNaBarra = !!barraControlos.querySelector(':focus-visible');
            arrumarBarra();
        });
        barraControlos.addEventListener('focusout', () => {
            tecladoNaBarra = false;
            arrumarBarra();
        });
        // Com o rato pousado na barra ela não se recolhe por baixo dele.
        barraControlos.addEventListener('mouseenter', () => {
            ratoNoFundo = true;
            arrumarBarra();
        });

        document.addEventListener('fullscreenchange', () => {
            ratoNoFundo = false;
            arrumarBarra();
        });
        arrumarBarra();

        // ---- Recuar, avançar e endireitar a vista ----
        const recuarBtn = document.getElementById('recuar-btn');
        const avancarBtn = document.getElementById('avancar-btn');
        const recentrarBtn = document.getElementById('recentrar-btn');
        const espera = document.getElementById('espera');
        const cameraEl = document.getElementById('camera');

        const SALTO = 5;
        const sinalEsquerda = document.getElementById('sinal-esquerda');
        const sinalDireita = document.getElementById('sinal-direita');
        const saltar = (segundos) => {
            if (!isFinite(video.duration)) return;
            video.currentTime = Math.min(Math.max(0, video.currentTime + segundos), video.duration);
            const sinal = segundos < 0 ? sinalEsquerda : sinalDireita;
            sinal.classList.remove('a-piscar');
            void sinal.offsetWidth;
            sinal.classList.add('a-piscar');
            showControls();
        };
        recuarBtn.addEventListener('click', (e) => { e.stopPropagation(); saltar(-SALTO); });
        avancarBtn.addEventListener('click', (e) => { e.stopPropagation(); saltar(SALTO); });

        // ---- Aproximar e afastar ----
        //
        // Numa rota 360º não há para onde andar: o que se faz é abrir e
        // fechar o ângulo por onde se olha, como quem chega os olhos ao
        // vidro. Quanto menor o ângulo, maior fica o que se vê. É o mesmo
        // das fotografias 360º, e faz-se com a roda do rato, com dois
        // dedos e com as teclas mais e menos.
        const palco = document.getElementById('palco-360');
        const ANGULO_LARGO = ABERTURA_INICIAL;   // como se chega à rota
        const ANGULO_APERTADO = 22; // o mais perto que se pode ir
        const PASSO_DO_ZOOM = 1.15; // em proporção: sente-se igual em qualquer ponto
        let angulo = ANGULO_LARGO;

        const aplicarZoom = (novo) => {
            // Numa entrevista vista em ecrã plano não há para onde chegar.
            if (ecraPlano) return;
            angulo = Math.min(ANGULO_LARGO, Math.max(ANGULO_APERTADO, novo));
            cameraEl.setAttribute('camera', 'fov', angulo);
        };

        palco.addEventListener('wheel', (e) => {
            if (ecraPlano) return;
            e.preventDefault();
            aplicarZoom(e.deltaY > 0 ? angulo * PASSO_DO_ZOOM : angulo / PASSO_DO_ZOOM);
        }, { passive: false });

        // Nos telemóveis, os dois dedos a abrir e a fechar.
        const distanciaEntreDedos = (toques) => {
            const dx = toques[0].clientX - toques[1].clientX;
            const dy = toques[0].clientY - toques[1].clientY;
            return Math.hypot(dx, dy);
        };
        let distanciaInicial = 0;
        let anguloInicial = 0;
        palco.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                distanciaInicial = distanciaEntreDedos(e.touches);
                anguloInicial = angulo;
            }
        }, { passive: true });
        palco.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && distanciaInicial > 0) {
                e.preventDefault();
                aplicarZoom(anguloInicial * distanciaInicial / distanciaEntreDedos(e.touches));
            }
        }, { passive: false });
        const largarDedos = () => { distanciaInicial = 0; };
        palco.addEventListener('touchend', largarDedos);
        palco.addEventListener('touchcancel', largarDedos);

        // Para onde cada rota olha ao começar — a volta (yaw) e a
        // inclinação (pitch), em graus, na lista dos vídeos. Uma rota que
        // não esteja lá começa a direito.
        const olharInicial = olharInicialDe(nome);
        const RAD = Math.PI / 180;

        // Aponta a câmara para o olhar inicial da rota.
        const apontarAoInicio = () => {
            const olhar = cameraEl && cameraEl.components && cameraEl.components['look-controls'];
            if (!olhar) return false;
            olhar.pitchObject.rotation.x = olharInicial.pitch * RAD;
            olhar.yawObject.rotation.y = olharInicial.yaw * RAD;
            return true;
        };

        // Mal a câmara nasça, já olha para onde a rota manda.
        if (!apontarAoInicio()) {
            cameraEl.addEventListener('componentinitialized', (e) => {
                if (e.detail && e.detail.name === 'look-controls') apontarAoInicio();
            });
            cameraEl.addEventListener('loaded', apontarAoInicio, { once: true });
        }

        // Endireitar a vista: quem se perde a olhar para trás volta ao
        // olhar inicial da rota com um botão, em vez de ter de arrastar
        // até acertar. E volta também à distância a que se chegou, para
        // o mesmo botão repor tudo como estava.
        const endireitar = () => {
            apontarAoInicio();
            aplicarZoom(ANGULO_LARGO);
            showControls();
        };
        recentrarBtn.addEventListener('click', (e) => { e.stopPropagation(); endireitar(); });

        // Numa entrevista vista em ecrã plano não há volta nenhuma a dar.
        if (ecraPlano) recentrarBtn.style.display = 'none';

        // Ir a um ponto do filme: as teclas dos números, de zero a nove,
        // levam ao princípio, a um décimo, a dois décimos… como em qualquer
        // tocador de vídeo. O Home e o End levam ao princípio e ao fim.
        const irA = (parte) => {
            if (!isFinite(video.duration)) return;
            // Um pouco antes do fim mesmo: no fim mesmo a rota, que anda
            // em volta, recomeçava logo do princípio.
            const fim = Math.max(0, video.duration - 0.25);
            video.currentTime = Math.min(fim, Math.max(0, parte * video.duration));
            showControls();
        };

        // ---- À espera de mais imagem ----
        video.addEventListener('waiting', () => espera.classList.add('a-esperar'));
        video.addEventListener('stalled', () => espera.classList.add('a-esperar'));
        ['playing', 'canplay', 'pause', 'seeked'].forEach((quando) => {
            video.addEventListener(quando, () => espera.classList.remove('a-esperar'));
        });

        // ---- Arrastar na barra do tempo ----
        // Antes só se podia clicar num ponto; agora pode-se arrastar por ela
        // fora, que é como toda a gente espera procurar um sítio no vídeo.
        let aArrastarTempo = false;
        const tempoNaBarra = (clientX) => {
            const caixa = progressContainer.getBoundingClientRect();
            const parte = Math.min(1, Math.max(0, (clientX - caixa.left) / caixa.width));
            if (isFinite(video.duration)) {
                video.currentTime = parte * video.duration;
                progressFilled.style.width = (parte * 100) + '%';
            }
        };
        progressContainer.addEventListener('pointerdown', (e) => {
            aArrastarTempo = true;
            progressContainer.setPointerCapture(e.pointerId);
            tempoNaBarra(e.clientX);
        });
        progressContainer.addEventListener('pointermove', (e) => {
            if (aArrastarTempo) tempoNaBarra(e.clientX);
        });
        const largarBarra = () => { aArrastarTempo = false; };
        progressContainer.addEventListener('pointerup', largarBarra);
        progressContainer.addEventListener('pointercancel', largarBarra);

        // ---- Teclas ----
        // As mesmas de qualquer tocador de vídeo, mais as que só aqui
        // fazem sentido: o R de endireitar a vista, o mais e o menos de
        // chegar e afastar. Virar a cabeça é no W, A, S e D — e nas setas
        // com o Alt em baixo — e disso trata o ficheiro do comando, que é
        // o mesmo das fotografias 360º.
        //
        // Saltar dentro do filme é no J e no L, ao lado do K que toca e
        // pára; os números levam a um ponto do filme. As setas dos lados
        // ficam livres porque, quando esta página está dentro do palco das
        // paragens, servem para mudar de paragem — e quem trata disso é o
        // mapa, lá fora. Aberta sozinha, no seu próprio endereço, não há
        // paragem nenhuma para onde ir, e aí as setas voltam a saltar no
        // filme.
        const sozinha = window.parent === window;
        window.addEventListener('keydown', (e) => {
            if (e.target && /^(?:INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
            if (e.altKey || e.ctrlKey || e.metaKey) return;
            const tecla = e.key.toLowerCase();
            if (tecla === ' ' || tecla === 'k') {
                e.preventDefault();
                togglePlay();
            } else if (tecla === 'j' || (sozinha && e.key === 'ArrowLeft')) {
                e.preventDefault();
                saltar(-5);
            } else if (tecla === 'l' || (sozinha && e.key === 'ArrowRight')) {
                e.preventDefault();
                saltar(5);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                volumeSlider.value = Math.min(1, parseFloat(volumeSlider.value) + 0.1);
                volumeSlider.dispatchEvent(new Event('input'));
                showControls();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                volumeSlider.value = Math.max(0, parseFloat(volumeSlider.value) - 0.1);
                volumeSlider.dispatchEvent(new Event('input'));
                showControls();
            } else if (tecla === 'm') {
                volumeBtn.click();
            } else if (tecla === 'f') {
                fullscreenBtn.click();
            } else if (tecla === 'r') {
                endireitar();
            } else if (e.key === '+' || e.key === '=') {
                aplicarZoom(angulo / PASSO_DO_ZOOM);
            } else if (e.key === '-' || e.key === '_') {
                aplicarZoom(angulo * PASSO_DO_ZOOM);
            } else if (/^[0-9]$/.test(e.key)) {
                e.preventDefault();
                irA(parseInt(e.key, 10) / 10);
            } else if (e.key === 'Home') {
                e.preventDefault();
                irA(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                irA(1);
            }
        });

        // ---- O aviso de como se vê um vídeo 360º ----
        // Aparece uma vez só, na primeira rota que se abrir. Quem já
        // percebeu como isto funciona não precisa de ouvir a explicação
        // outra vez a cada rota — por isso fica escrito no navegador que
        // já foi dado, e não apenas nesta visita.
        const CHAVE_DA_AJUDA = 'ajuda360Dada';
        const ajudaJaDada = () => {
            try {
                return localStorage.getItem(CHAVE_DA_AJUDA) === '1';
            } catch (e) {
                return false;
            }
        };
        const guardarAjudaDada = () => {
            try {
                localStorage.setItem(CHAVE_DA_AJUDA, '1');
            } catch (e) { /* sem memória no navegador: aparece outra vez */ }
        };

        const ajuda = document.getElementById('ajuda-360');
        const ajudaFechar = document.getElementById('ajuda-fechar');
        let ajudaMostrada = false;
        let ajudaSozinha = null;

        const esconderAjuda = () => {
            clearTimeout(ajudaSozinha);
            ajuda.classList.remove('visivel');
        };

        const mostrarAjuda = () => {
            // Só nas rotas: uma entrevista em ecrã plano não tem volta a dar.
            // E não dentro dos óculos, onde este aviso não se vê.
            if (ajudaMostrada || ajudaJaDada() || ecraPlano || pedidoDeVR || scene.is('vr-mode')) return;
            ajudaMostrada = true;
            guardarAjudaDada();

            // Num ecrã de toque as palavras são outras.
            const toque = window.matchMedia('(pointer: coarse)').matches;
            if (toque && window.Idiomas) {
                document.getElementById('ajuda-olhar').textContent = window.Idiomas.t('v360.ajudaOlharToque');
                document.getElementById('ajuda-pausa').textContent = window.Idiomas.t('v360.ajudaPausaToque');
            }
            if (vrBtn.style.display !== 'none') {
                document.getElementById('ajuda-oculos').style.display = '';
            }

            ajuda.classList.add('visivel');
            ajudaSozinha = setTimeout(esconderAjuda, 9000);
        };

        ajudaFechar.addEventListener('click', (e) => { e.stopPropagation(); esconderAjuda(); });
        ajuda.addEventListener('click', esconderAjuda);
        video.addEventListener('play', mostrarAjuda, { once: true });

        // ---- Dentro dos óculos, o sensor de movimento volta a mandar ----
        scene.addEventListener('enter-vr', () => {
            esconderAjuda();
            cameraEl.setAttribute('look-controls', 'magicWindowTrackingEnabled', true);
        });
        scene.addEventListener('exit-vr', () => {
            cameraEl.setAttribute('look-controls', 'magicWindowTrackingEnabled', false);
        });

        // Click on 360 video canvas to toggle Play/Pause (avoid triggering on drag)
        let mousedownPos = {x:0, y:0};
        window.addEventListener('mousedown', (e) => {
            mousedownPos = {x: e.clientX, y: e.clientY};
        });
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                mousedownPos = {x: e.touches[0].clientX, y: e.touches[0].clientY};
            }
        });
        
        const handleInteractionEnd = (clientX, clientY, target) => {
            if (target.closest('.video-controls') || target.closest('#play-overlay') || target.closest('.big-play-btn')) return;
            
            const dx = clientX - mousedownPos.x;
            const dy = clientY - mousedownPos.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < 10 && target.tagName.toLowerCase() === 'canvas') {
                // O clique único espera um instante: se vier um segundo
                // atrás dele, o que se queria era saltar e não pausar.
                clearTimeout(cliqueSozinho);
                cliqueSozinho = setTimeout(togglePlay, 260);
            }
        };

        let cliqueSozinho = null;

        // Duplo clique de um dos lados: para trás do lado esquerdo, para a
        // frente do direito, como em qualquer tocador de telemóvel.
        window.addEventListener('dblclick', (e) => {
            const alvo = e.target;
            if (!alvo || alvo.tagName.toLowerCase() !== 'canvas') return;
            clearTimeout(cliqueSozinho);
            saltar(e.clientX < window.innerWidth / 2 ? -SALTO : SALTO);
        });

        window.addEventListener('mouseup', (e) => {
            handleInteractionEnd(e.clientX, e.clientY, e.target);
        });
        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length > 0) {
                handleInteractionEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY, e.target);
            }
        });
        
        // Com o vídeo parado, o rato volta a aparecer.
        video.addEventListener('pause', () => {
            clearTimeout(ratoParado);
            document.body.classList.remove('hide-cursor');
        });

        // ---- As coordenadas do olhar ----
        //
        // Uma janela no canto, só para quem tem o menu de desenvolvedor
        // ligado no mapa (a mesma memória do navegador diz-o aqui): a
        // volta e a inclinação da câmara em graus, a abertura, e o segundo
        // do filme. Serve para apontar de onde se quer que cada paragem
        // comece a ser vista. Actualiza-se a cada imagem enquanto se vê.
        (function coordenadasDoOlhar() {
            const janela = document.getElementById('coordenadas');
            if (!janela) return;
            let ligada = false;
            const verSeEstaLigada = () => {
                let quer = false;
                try { quer = localStorage.getItem('programador') === 'on'; } catch (e) { /* sem memória */ }
                if (quer !== ligada) {
                    ligada = quer;
                    janela.classList.toggle('visivel', ligada);
                }
            };
            const graus = (radianos) => {
                let g = radianos * 180 / Math.PI;
                g = ((g + 180) % 360 + 360) % 360 - 180;
                return (g >= 0 ? '+' : '') + g.toFixed(1) + '°';
            };
            const escrever = () => {
                verSeEstaLigada();
                if (ligada) {
                    const olhar = cameraEl && cameraEl.components && cameraEl.components['look-controls'];
                    const volta = olhar ? graus(olhar.yawObject.rotation.y) : '—';
                    const inclinacao = olhar ? graus(olhar.pitchObject.rotation.x) : '—';
                    janela.textContent =
                        'yaw    ' + volta + '\n' +
                        'pitch  ' + inclinacao + '\n' +
                        'fov    ' + angulo.toFixed(0) + '°\n' +
                        'tempo  ' + video.currentTime.toFixed(1) + ' s';
                }
                requestAnimationFrame(escrever);
            };
            escrever();
        })();

    </script>
</body>
</html>
