<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fotografia 360º</title>
    <script src="/idiomas.js?v=37"></script>
    <script src="/quadrado-de-espera.js?v=4"></script>
    <!-- O aviso de "está a demorar" e a tecla de tentar de novo, os
         mesmos em todo o site. -->
    <script src="/rede-de-seguranca.js?v=3"></script>
    <script src="/motor/aframe-1.4.0.min.js"></script>
    <!-- O dedo olha para todos os lados, e não só de lado a lado. -->
    <script src="/toque-360.js?v=1"></script>
    <script src="/comando-paginas.js?v=4" defer></script>
    <style>
        /* A letra do site: a Liberation Mono, servida daqui mesmo (ficheiros
           em /fonts, licença SIL Open Font). Dois pesos chegam: o normal
           até ao meio-negro, o negro daí para cima. */
        @font-face {
            font-family: 'Liberation Mono';
            src: url('/fonts/LiberationMono-Regular.ttf') format('truetype');
            font-weight: 100 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Liberation Mono';
            src: url('/fonts/LiberationMono-Bold.ttf') format('truetype');
            font-weight: 600 900;
            font-style: normal;
            font-display: swap;
        }
        html { margin: 0; padding: 0; width: 100%; height: 100%; }

        /* A fotografia em cima e a barra dos comandos em baixo, uma por
           cima da outra: a barra deixa de tapar a paisagem. */
        body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #05050a; overflow: hidden; font-family: 'Liberation Mono', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
        }

        /* Onde a fotografia vive. A cena enche isto por inteiro. */
        #palco-360 {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
        }

        /* Enquanto a fotografia não chega, anda o quadrado de espera do
           site, o mesmo do bairro e dos vídeos. */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #05050a; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px;
            transition: opacity 0.4s ease;
        }
        #loading-overlay.escondido { opacity: 0; pointer-events: none; }

        .aviso {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }

        /* A barra dos comandos, com o mesmo desenho da dos vídeos: por
           baixo da fotografia, e não por cima dela. Traz o mesmo véu de
           luz da barra do nome da janela onde esta página é vista, virado
           ao contrário. */
        .video-controls {
            flex: 0 0 auto;
            background: linear-gradient(to top, rgba(255,255,255,0.05), transparent);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 24px 16px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
            z-index: 1000;
        }

        .player-btn {
            background: transparent;
            border: 2.5px solid rgba(255, 255, 255, 0.15);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: background 0.15s ease;
            padding: 8px;
            border-radius: 0;
        }
        /* Com o rato em cima o botão não cresce: ganha o quadrado preto,
           como nos vídeos e no cabeçalho do bairro. Só onde há rato — num
           ecrã táctil o "rato em cima" fica agarrado ao último botão
           tocado. */
        @media (hover: hover) {
            .player-btn:hover {
                background: #05050a;
                color: #ffffff;
            }
        }

        /* Um botão que já não pode ir mais longe (aproximar no máximo,
           afastar no mínimo) fica com o contorno como os outros e só o
           desenho apagado, num cinzento opaco claro o bastante para não
           se perder na fotografia; com o rato em cima não se enche,
           porque não há nada para fazer. */
        .player-btn:disabled {
            color: #8e8e91;
            cursor: default;
        }
        .player-btn:disabled:hover {
            background: transparent;
        }

        /* Sem barras: quando a página é aberta de lado a lado (a
           fotografia do alto do bairro), os comandos deixam de ter a sua
           faixa e ficam a pairar sobre a fotografia, ao canto de baixo à
           direita. Os botões são os dos vídeos: transparentes, só com o
           contorno meio transparente, e pretos com o rato em cima. */
        body.inteira .video-controls {
            position: absolute;
            right: 0;
            bottom: 0;
            background: transparent;
            border-top: none;
        }

        @media (max-width: 900px) {
            .video-controls {
                padding: 12px 12px 14px;
                gap: 8px;
            }
            .player-btn svg {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- A fotografia em cima, os comandos em baixo. A cena é "embedded"
         para caber neste sítio em vez de tomar a página toda. -->
    <div id="palco-360">
        <a-scene embedded loading-screen="enabled: false" vr-mode-ui="enabled: false">
            <a-entity id="camera" camera="fov: 80" look-controls="reverseMouseDrag: true"></a-entity>
            <a-sky id="ceu" rotation="0 -90 0"></a-sky>
        </a-scene>

        <div id="loading-overlay">
            <div id="espera"></div>
            <div class="aviso" data-i18n="foto.carregar">A carregar fotografia 360º…</div>
        </div>
    </div>

    <div class="video-controls" id="controlos">
        <button class="player-btn" id="afastar-btn" title="Afastar" data-i18n-title="foto.afastar" aria-label="Afastar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><circle cx="11" cy="11" r="7"></circle><line x1="8" y1="11" x2="14" y2="11"></line><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
        </button>
        <button class="player-btn" id="aproximar-btn" title="Aproximar" data-i18n-title="foto.aproximar" aria-label="Aproximar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><circle cx="11" cy="11" r="7"></circle><line x1="8" y1="11" x2="14" y2="11"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
        </button>
        <button class="player-btn" id="vr-btn" title="Ver com óculos" data-i18n-title="video.oculos" style="display: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-2.5a2 2 0 0 1-1.7-1l-.9-1.4a1.2 1.2 0 0 0-2 0l-.9 1.4a2 2 0 0 1-1.7 1H6a3 3 0 0 1-3-3z"></path></svg>
        </button>
        <button class="player-btn" id="fullscreen-btn" title="Ecrã inteiro" data-i18n-title="foto.ecra">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 3H3v5m18 0V3h-5m0 18h5v-5M3 16v5h5"></path></svg>
        </button>
    </div>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const endereco = parametros.get('src') || '/ceu-olho-de-aguia.jpg';
        if (parametros.get('inteira') === '1') document.body.classList.add('inteira');

        const ceu = document.getElementById('ceu');
        const overlay = document.getElementById('loading-overlay');
        const cena = document.querySelector('a-scene');

        // A espera veste o quadrado de espera do site.
        if (window.QuadradoDeEspera) {
            window.QuadradoDeEspera.fazer(document.getElementById('espera'));
        }

        // A rede de segurança da janela (ver rede-de-seguranca.js): se a
        // fotografia demorar demais, diz-se que está a demorar e dá-se a
        // tecla de tentar de novo; se algo falhar de vez — o visor 360º
        // que não veio, a fotografia que não há — diz-se logo, e o
        // quadrado de espera sai, porque já não há espera nenhuma.
        const rede = window.RedeDeSeguranca ? window.RedeDeSeguranca.vigiar({
            espera: 40,
            pronto: () => overlay.classList.contains('escondido'),
            caixa: () => overlay
        }) : null;
        const falhou = (chave, textoPt) => {
            document.getElementById('espera').style.display = 'none';
            overlay.querySelector('.aviso').style.display = 'none';
            if (rede) rede.avisar(chave, textoPt);
            else overlay.textContent = (window.Idiomas && window.Idiomas.t(chave)) || textoPt;
        };
        const semVisor = !window.AFRAME;
        if (semVisor) falhou('visor.erro', 'Não foi possível abrir o visor 360º.');

        // A fotografia é trazida à parte para se saber ao certo quando está
        // pronta — e para haver um aviso claro se não vier.
        const fotografia = new Image();
        fotografia.crossOrigin = 'anonymous';
        fotografia.onload = () => {
            // Sem visor não há onde a pôr: fica o aviso que já lá está.
            if (semVisor) return;
            ceu.setAttribute('material', { shader: 'flat', src: endereco, side: 'back' });
            overlay.classList.add('escondido');
        };
        fotografia.onerror = () => falhou('foto.erro', 'Não foi possível carregar a fotografia 360º.');
        fotografia.src = endereco;

        // Ecrã inteiro. O pedido é feito à página toda (e não só ao corpo),
        // que é o que os navegadores tratam melhor, e a seguir avisa-se a
        // cena para se voltar a medir — senão ficava a fotografia pequena
        // no meio de um ecrã preto.
        const botaoEcra = document.getElementById('fullscreen-btn');
        const iconeEntrar = botaoEcra.innerHTML;
        const iconeSair = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 9h6V3 M21 9h-6V3 M21 15h-6v6 M3 15h6v6"></path></svg>';

        botaoEcra.addEventListener('click', () => {
            const alvo = document.documentElement;
            const entrar = alvo.requestFullscreen || alvo.webkitRequestFullscreen;
            const sair = document.exitFullscreen || document.webkitExitFullscreen;
            const jaEsta = document.fullscreenElement || document.webkitFullscreenElement;
            try {
                if (!jaEsta) {
                    const pedido = entrar.call(alvo);
                    if (pedido && pedido.catch) pedido.catch(() => {});
                } else {
                    sair.call(document);
                }
            } catch (e) { /* navegador sem ecrã inteiro: não há mais nada a fazer */ }
        });

        const aoMudarDeEcra = () => {
            const dentro = !!(document.fullscreenElement || document.webkitFullscreenElement);
            botaoEcra.innerHTML = dentro ? iconeSair : iconeEntrar;
            // A cena tem de se voltar a medir para encher o novo tamanho.
            window.dispatchEvent(new Event('resize'));
            if (cena && cena.resize) setTimeout(() => cena.resize(), 60);
        };
        document.addEventListener('fullscreenchange', aoMudarDeEcra);
        document.addEventListener('webkitfullscreenchange', aoMudarDeEcra);

        const botaoVR = document.getElementById('vr-btn');
        if (navigator.xr && navigator.xr.isSessionSupported) {
            navigator.xr.isSessionSupported('immersive-vr').then((ha) => {
                if (ha) botaoVR.style.display = 'flex';
            }).catch(() => {});
        }
        botaoVR.addEventListener('click', () => {
            if (cena.is('vr-mode')) cena.exitVR();
            else cena.enterVR().catch(() => {});
        });

        // ---- Aproximar e afastar ----
        //
        // Numa fotografia 360º não há para onde andar: o que se faz é
        // abrir e fechar o ângulo por onde se olha, como quem chega os
        // olhos ao vidro. Quanto menor o ângulo, maior fica o que se vê.
        const camara = document.getElementById('camera');
        const palco = document.getElementById('palco-360');
        const botaoAproximar = document.getElementById('aproximar-btn');
        const botaoAfastar = document.getElementById('afastar-btn');

        const ANGULO_LARGO = 80;   // como se chega à fotografia
        const ANGULO_APERTADO = 22; // o mais perto que se pode ir
        // A mesma suavidade das rotas 360º (ver video360.html): quanto
        // demora o ângulo a chegar perto de onde se pediu, em segundos.
        const SUAVIDADE_DO_ZOOM = 0.12;
        let angulo = ANGULO_LARGO;      // o ângulo que se vê agora
        let anguloPedido = ANGULO_LARGO; // para onde está a ir

        // O ângulo não salta para o pedido: vai lá a deslizar, imagem a
        // imagem, cada vez mais devagar à medida que chega — e um pedido
        // novo a meio só muda o destino, sem recomeçar nada.
        let aDeslizarOZoom = false;
        let instanteAnterior = 0;
        const deslizarOZoom = (agora) => {
            const dt = instanteAnterior ? Math.min(0.1, (agora - instanteAnterior) / 1000) : 1 / 60;
            instanteAnterior = agora;
            const falta = anguloPedido - angulo;
            if (Math.abs(falta) < 0.02) {
                angulo = anguloPedido;
                aDeslizarOZoom = false;
            } else {
                angulo += falta * (1 - Math.exp(-dt / SUAVIDADE_DO_ZOOM));
            }
            camara.setAttribute('camera', 'fov', angulo);
            if (aDeslizarOZoom) requestAnimationFrame(deslizarOZoom);
        };

        const aplicarZoom = (novo) => {
            anguloPedido = Math.min(ANGULO_LARGO, Math.max(ANGULO_APERTADO, novo));
            botaoAproximar.disabled = anguloPedido <= ANGULO_APERTADO;
            botaoAfastar.disabled = anguloPedido >= ANGULO_LARGO;
            if (!aDeslizarOZoom) {
                aDeslizarOZoom = true;
                instanteAnterior = 0;
                requestAnimationFrame(deslizarOZoom);
            }
        };

        // Passo em proporção: perto anda devagar, longe anda depressa, e
        // assim o zoom sente-se igual em qualquer ponto.
        const PASSO = 1.15;
        botaoAproximar.addEventListener('click', () => aplicarZoom(anguloPedido / PASSO));
        botaoAfastar.addEventListener('click', () => aplicarZoom(anguloPedido * PASSO));

        // A roda conta quanto rodou, e não só para que lado: um rato de
        // roda aos saltos dá o mesmo passo de sempre por cada estalido, e
        // um tapete táctil, que manda muitos toques pequenos, aproxima aos
        // poucos em vez de aos pulos.
        palco.addEventListener('wheel', (e) => {
            e.preventDefault();
            const porLinha = e.deltaMode === 1 ? 33 : (e.deltaMode === 2 ? 400 : 1);
            const rodou = Math.max(-300, Math.min(300, e.deltaY * porLinha));
            aplicarZoom(anguloPedido * Math.pow(PASSO, rodou / 100));
        }, { passive: false });

        // Nos telemóveis, os dois dedos a abrir e a fechar.
        const distanciaEntreDedos = (toques) => {
            const dx = toques[0].clientX - toques[1].clientX;
            const dy = toques[0].clientY - toques[1].clientY;
            return Math.hypot(dx, dy);
        };
        let distanciaInicial = 0;
        let anguloInicial = 0;
        palco.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                distanciaInicial = distanciaEntreDedos(e.touches);
                anguloInicial = anguloPedido;
            }
        }, { passive: true });
        palco.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && distanciaInicial > 0) {
                e.preventDefault();
                aplicarZoom(anguloInicial * distanciaInicial / distanciaEntreDedos(e.touches));
            }
        }, { passive: false });
        const largarDedos = () => { distanciaInicial = 0; };
        palco.addEventListener('touchend', largarDedos);
        palco.addEventListener('touchcancel', largarDedos);

        // Endireitar a vista: quem se perde a olhar para trás volta ao
        // princípio, e à distância a que chegou, com uma tecla só.
        const endireitar = () => {
            const olhar = camara.components && camara.components['look-controls'];
            if (olhar) {
                olhar.pitchObject.rotation.x = 0;
                olhar.yawObject.rotation.y = 0;
            }
            aplicarZoom(ANGULO_LARGO);
        };

        // De teclado: mais, menos, o zero para voltar ao princípio e o R
        // para endireitar a vista — o mesmo R das rotas 360º. Virar a
        // cabeça é no W, A, S e D, e disso trata o ficheiro do comando.
        window.addEventListener('keydown', (e) => {
            if (e.altKey || e.ctrlKey || e.metaKey) return;
            if (e.key === '+' || e.key === '=') aplicarZoom(anguloPedido / PASSO);
            else if (e.key === '-' || e.key === '_') aplicarZoom(anguloPedido * PASSO);
            else if (e.key === '0') aplicarZoom(ANGULO_LARGO);
            else if (e.key.toLowerCase() === 'r') endireitar();
        });

        aplicarZoom(ANGULO_LARGO);

        // A barra fica sempre à vista: está fora da fotografia e não tapa
        // nada, por isso não há razão para se esconder sozinha.
    </script>
</body>
</html>
