<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Image Viewer</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/three@0.137.0/examples/js/loaders/EXRLoader.js"></script>
    <script>
        AFRAME.registerComponent('dynamic-sky', {
            schema: {
                src: {type: 'string'}
            },
            init: function () {
                const el = this.el;
                const src = this.data.src;
                
                // Show loading spinner
                const spinner = document.getElementById('spinner');
                if (spinner) spinner.style.display = 'block';

                if (src.toLowerCase().endsWith('.exr')) {
                    // It's an EXR file, use Three.js EXRLoader
                    const mesh = el.getObject3D('mesh');
                    if (!mesh) return;

                    const loader = new THREE.EXRLoader();
                    loader.load(src, function (texture) {
                        texture.mapping = THREE.EquirectangularReflectionMapping;
                        texture.encoding = THREE.LinearEncoding;

                        const material = new THREE.MeshBasicMaterial({ 
                            map: texture,
                            side: THREE.BackSide,
                            color: 0xffffff
                        });
                        
                        mesh.material = material;
                        mesh.material.needsUpdate = true;

                        if (spinner) spinner.style.display = 'none';
                    }, undefined, function(err) {
                        console.error('Erro EXR:', err);
                        if (spinner) spinner.style.display = 'none';
                        alert('Erro ao carregar imagem EXR.');
                    });
                } else {
                    // It's a standard image format (JPG/PNG), use A-Frame's standard sky material
                    el.setAttribute('material', {
                        src: src,
                        side: 'back',
                        shader: 'flat'
                    });
                    
                    // A-Frame material texture loading event
                    el.addEventListener('materialtextureloaded', () => {
                        if (spinner) spinner.style.display = 'none';
                    });
                    
                    // Fallback to hide spinner after a timeout if event doesn't fire
                    setTimeout(() => { if (spinner) spinner.style.display = 'none'; }, 2000);
                }
            }
        });
    </script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #05050a; overflow: hidden; font-family: sans-serif; }
        
        body.hide-cursor, body.hide-cursor * {
            cursor: none !important;
        }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }
        
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner" id="spinner"></div>
    </div>

    <!-- A-Frame 360 Engine -->
    <a-scene loading-screen="enabled: false" vr-mode-ui="enabled: false" renderer="colorManagement: true; physicallyCorrectLights: true;">
        <a-entity id="camera" camera look-controls="reverseMouseDrag: true"></a-entity>
        
        <a-entity id="sky-entity"
            geometry="primitive: sphere; radius: 500; segmentsWidth: 64; segmentsHeight: 32"
            scale="-1 1 1"
            rotation="0 -90 0">
        </a-entity>
    </a-scene>

    <script>
        // Read the src parameter from URL and set it to the dynamic-sky component
        const urlParams = new URLSearchParams(window.location.search);
        let src = urlParams.get('src') || '/olho-de-aguia.jpg';
        
        const skyEntity = document.getElementById('sky-entity');
        skyEntity.setAttribute('dynamic-sky', 'src: ' + src);
    </script>
</body>
</html>
